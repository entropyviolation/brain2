<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solarpunk Sanctuary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ph:#7dffc4;--ice:#9ad7ff;--pur:#b9a8ff;--glass:rgba(5,18,13,.66);--edge:rgba(125,255,196,.28);--glow:0;--ink:#d9fff0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#020604;color:var(--ink);font:12px/1.4 "Space Mono",ui-monospace,monospace}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 0 3px rgba(125,255,196,.8))}
#leaders line{stroke:var(--ph);stroke-width:1;opacity:.75}
#labels{position:fixed;inset:0;pointer-events:none}
.hud{position:fixed;z-index:5;background:var(--glass);border:1px solid var(--edge);border-radius:14px;backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.25),0 0 calc(var(--glow)*18px) rgba(125,255,196,.18)}
.tl{top:16px;left:16px;padding:10px 14px}
.ttl{font-family:VT323,monospace;font-size:24px;letter-spacing:2px;color:var(--ph);line-height:1;text-shadow:0 0 calc(4px + var(--glow)*8px) rgba(125,255,196,.6)}
.sub{margin-top:4px;color:#a9d8c4;font-size:11px;display:flex;gap:6px;align-items:center}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ph);box-shadow:0 0 6px var(--ph);flex:none}
.led.goal{background:var(--ice);box-shadow:0 0 6px var(--ice)}.led.exc{background:var(--pur);box-shadow:0 0 6px var(--pur)}
.tr{top:16px;right:16px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.seg{display:flex;gap:2px;background:rgba(0,0,0,.3);border-radius:10px;padding:2px}
.seg button,#live,.go,#back{font:inherit;color:#a9d8c4;background:transparent;border:0;border-radius:8px;padding:5px 9px;cursor:pointer}
.seg button.on,#live.on{background:rgba(125,255,196,.14);color:var(--ph);box-shadow:inset 0 0 0 1px rgba(125,255,196,.4),0 0 10px rgba(125,255,196,.15)}
.seg button:focus-visible,#live:focus-visible,.go:focus-visible,#back:focus-visible,.pill-h:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.bot{left:50%;bottom:16px;transform:translateX(-50%);padding:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px)}
.zoom button b{font-family:VT323,monospace;font-size:16px;margin-right:4px;color:var(--ph)}
.time{display:flex;align-items:center;gap:8px;padding:0 4px}
#clk{font-family:VT323,monospace;font-size:20px;color:var(--ph);min-width:46px}
#tod{width:150px;accent-color:#7dffc4}
#tag{position:fixed;right:16px;top:64px;z-index:4;font-size:10px;color:#a9d8c4;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:4px 10px}
.pill{position:absolute;left:0;top:0;opacity:0;transform:translate(-50%,-100%);pointer-events:auto;transition:opacity .25s;will-change:transform}
.pill-h{display:flex;align-items:center;gap:6px;font:inherit;font-size:11px;color:var(--ph);background:rgba(3,14,9,.74);border:1px solid rgba(125,255,196,.38);border-radius:999px;padding:3px 9px 3px 7px;cursor:pointer;white-space:nowrap;box-shadow:0 0 calc(4px + var(--glow)*14px) rgba(125,255,196,calc(.15 + var(--glow)*.35));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pill-h svg{width:12px;height:12px;flex:none}
.pill .nm{display:inline-block;vertical-align:bottom;color:var(--ink);max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.full .nm,.pill.open .nm,.pill:hover .nm{display:inline}
.pill .tm{font-family:VT323,monospace;font-size:15px;line-height:1}
.det{display:none}
.pill.open{z-index:3}
.pill.open .pill-h{border-radius:14px 14px 0 0;width:100%;border-bottom-color:transparent}
.pill.open .det{display:block;width:290px;background:rgba(3,14,9,.86);border:1px solid rgba(125,255,196,.38);border-top:0;border-radius:0 0 14px 14px;padding:4px 12px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pill.open .pill-h{width:290px}
.crt{background:#040a08;border-radius:8px;padding:8px 10px;margin:4px 0 8px;box-shadow:inset 0 0 12px rgba(125,255,196,.12)}
.crt b{display:block;font-family:VT323,monospace;font-weight:400;font-size:36px;line-height:1;color:var(--ph);text-shadow:0 0 8px rgba(125,255,196,.6)}
.crt span{color:#86b8a2;font-size:10px}
.was{color:#a9d8c4}.was b{color:var(--ink);font-weight:400}
.note{margin:6px 0;padding:6px 8px;border-left:2px solid rgba(154,215,255,.5);color:#cfe9ff;font-size:11px}
.note span{display:block;color:#7fa3b8;font-size:9px;letter-spacing:1px;text-transform:uppercase}
.lines{list-style:none;margin:8px 0;padding:0;display:grid;gap:4px}
.lines li{display:grid;grid-template-columns:38px 1fr auto;gap:6px;align-items:baseline;font-size:11px}
.lines li.cur span::before{content:"\25B8 ";color:var(--ph)}
.lines em{font-style:normal;color:#86b8a2;font-size:10px}
.tier{font-style:normal;font-size:9px;border-radius:4px;padding:0 4px;text-align:center;border:1px solid}
.tier.min{color:var(--ph);border-color:rgba(125,255,196,.5)}.tier.goal{color:var(--ice);border-color:rgba(154,215,255,.5)}.tier.exc{color:var(--pur);border-color:rgba(185,168,255,.5)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.go,#back{flex:1;background:rgba(125,255,196,.16);color:var(--ph);font-weight:700;padding:8px 10px;box-shadow:inset 0 0 0 1px rgba(125,255,196,.5),0 0 14px rgba(125,255,196,.2)}
.go.alt{background:rgba(154,215,255,.1);color:var(--ice);box-shadow:inset 0 0 0 1px rgba(154,215,255,.45)}
.go:hover,#back:hover{background:rgba(125,255,196,.26)}
.hint{width:100%;color:#86b8a2;font-size:10px}
#run{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 22px;text-align:center;min-width:270px;max-width:calc(100vw - 32px)}
#run[hidden]{display:none}
.rh{display:flex;gap:6px;align-items:center;justify-content:center;color:var(--ph);font-size:11px;letter-spacing:1px}
#rc{font-family:VT323,monospace;font-size:64px;line-height:1;color:var(--ph);text-shadow:0 0 14px rgba(125,255,196,.6);margin:8px 0;background:#040a08;border-radius:10px;padding:6px 14px}
#rx{color:#86b8a2;font-size:11px;margin:4px 0 12px}
#back{width:100%}
@media (max-width:640px){
 .tl{top:12px;left:12px;padding:8px 10px}.ttl{font-size:20px}
 .tr{top:auto;bottom:118px;right:12px;left:12px;justify-content:center;max-width:none}
 .bot{bottom:12px;left:12px;right:12px;transform:none;max-width:none}
 .zoom button{padding:5px 6px}.zoom button span{display:none}
 #tod{width:110px}
 #tag{top:14px;right:12px;max-width:150px;text-align:right;border-radius:10px}
 .pill.open{position:fixed!important;left:12px!important;right:12px;top:auto!important;bottom:12px;transform:none!important;z-index:8}
 .pill.open .pill-h,.pill.open .det{width:100%}
}
@media (prefers-reduced-motion:reduce){.pill{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="A white terraced parking structure in a jungle, inside a glass dome"></canvas>
<svg id="leaders" aria-hidden="true"></svg>
<div id="labels"></div>
<header class="hud tl"><div class="ttl">PARKING LOT</div><div class="sub"><span class="led"></span><span id="count">9 parked</span>·<span id="phase">—</span></div></header>
<div class="hud tr">
 <div class="seg" id="styleSeg" role="group" aria-label="Car style"><button data-v="concept" class="on">Concept</button><button data-v="retro">Retro</button></div>
 <div class="seg" id="qSeg" role="group" aria-label="Quality"><button data-v="high" class="on">High</button><button data-v="low">Low</button></div>
</div>
<div class="hud bot">
 <div class="seg zoom" id="zoomSeg" role="group" aria-label="Zoom">
  <button data-z="1"><b>1</b><span>Car</span></button><button data-z="2" class="on"><b>2</b><span>Structure</span></button><button data-z="3"><b>3</b><span>Forest</span></button><button data-z="4"><b>4</b><span>Macro</span></button>
 </div>
 <div class="time"><span id="clk">--:--</span><input type="range" id="tod" min="0" max="24" step="0.05" aria-label="Time of day"><button id="live" class="on">Live</button></div>
</div>
<div id="tag">5 · Solarpunk sanctuary — breaks the rules</div>
<div id="run" class="hud" hidden>
 <div class="rh"><span class="led"></span>RUNNING · <span id="rn"></span></div>
 <div id="rc">0:00</div>
 <div class="was">On <b id="rw"></b></div>
 <div id="rx"></div>
 <button id="back">back to the lot</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="solarpunk-cars.js"></script>
<script>
(()=>{
'use strict';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const V3=THREE.Vector3, COL=THREE.Color, MU=THREE.MathUtils;
const TAU=Math.PI*2, CZ=40, TH=0.46;
let W=innerWidth, H=innerHeight;
const SMALL=Math.min(W,H)<600, QF=SMALL?0.6:1;
const S={style:'concept',q:'high',zoom:2,live:true,tod:12,sel:0,glow:0,running:null};
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
const P=(r,a,y=0)=>new V3(r*Math.sin(a),y,CZ-r*Math.cos(a));
const HAS_GSAP=!!window.gsap, ANIM=HAS_GSAP&&!RM;

/* ---------- sessions ---------- */
const SESS=[
 {name:'Foxtide work',left:10755,totalS:10800,total:'3h',parked:'Thu 04:33 AM',was:'Finish CDs',icon:'leaf',note:'Start with the CD sleeves, the art is done.',
  lines:[['Min','Finish CDs','1m / 4h 35m',1],['Goal','New merch designs (shirts, hoodie, tote, hat)','0m / 5h'],['Exc',"Book Elijah's flights",'0m / 30m']]},
 {name:'Inbox zero sprint',left:1120,totalS:2700,total:'45m',parked:'Wed 9:12 PM',was:'Reply to landlord',icon:'signal',
  lines:[['Min','Reply to landlord','6m / 10m',1],['Goal','Archive newsletters','0m / 15m']]},
 {name:'Studio reset',left:3900,totalS:5400,total:'1h 30m',parked:'2 days ago',was:'Restring guitar',icon:'gear',stale:1,
  lines:[['Min','Restring guitar','10m / 20m',1],['Goal','Clear the desk','0m / 30m'],['Exc','Re-patch the synth','0m / 40m']]},
 {name:'Garden plan',left:2400,totalS:3600,total:'1h',parked:'Tue 6:10 PM',was:'Sketch beds',icon:'leaf',
  lines:[['Min','Sketch beds','12m / 20m',1],['Goal','Order seeds','0m / 20m']]},
 {name:'Tax receipts',left:5400,totalS:7200,total:'2h',parked:'Mon 11:02 AM',was:'Sort by month',icon:'gear',
  lines:[['Min','Sort by month','20m / 40m',1],['Goal','Scan the stack','0m / 45m'],['Exc','Fill the summary sheet','0m / 30m']]},
 {name:'Morning pages',left:720,totalS:1200,total:'20m',parked:'Today 7:48 AM',was:'Page two',icon:'leaf',
  lines:[['Min','Page two','8m / 10m',1],['Goal','Page three','0m / 10m']]},
 {name:'Practice set',left:1500,totalS:2700,total:'45m',parked:'Sun 3:20 PM',was:'Scales in E',icon:'signal',
  lines:[['Min','Scales in E','15m / 15m',1],['Goal','Run the new song','0m / 20m'],['Exc','Record one take','0m / 10m']]},
 {name:'Zine layout',left:7800,totalS:10800,total:'3h',parked:'Sat 1:15 PM',was:'Cover type',icon:'gear',
  lines:[['Min','Cover type','40m / 1h',1],['Goal','Inner spreads','0m / 1h 30m']]},
 {name:'Call list',left:900,totalS:1800,total:'30m',parked:'Fri 10:30 AM',was:'Dentist',icon:'signal',
  lines:[['Min','Dentist','5m / 10m',1],['Goal','Bank','0m / 10m'],['Exc','Book the van','0m / 10m']]},
];
const ICON={
 leaf:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 13C3 6 8 3 14 3c0 6-3 11-10 11"/><path d="M3 13l6-6"/></svg>',
 gear:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>',
 signal:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="10" width="2.4" height="4" rx=".5"/><rect x="6.8" y="7" width="2.4" height="7" rx=".5"/><rect x="11.6" y="3" width="2.4" height="11" rx=".5"/></svg>'
};
const fmt=s=>{s=Math.max(0,Math.round(s));const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;};

/* ---------- renderer ---------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new COL(0x020604);
scene.fog=new THREE.FogExp2(0xdde8ee,0.003);
const camera=new THREE.PerspectiveCamera(24,W/H,0.3,4000);

/* ---------- shared uniforms + shader bits ---------- */
const U={time:{value:0},glow:{value:0},stars:{value:0},mist:{value:0},
 sunDir:{value:new V3(0,1,0)},moonDir:{value:new V3(0,1,0)},
 top:{value:new COL()},hor:{value:new COL()},sunC:{value:new COL()},
 glowC:{value:new COL(0x2fe6a8)},deep:{value:new COL(0x0b3b38)}};
const VS=`varying vec3 vW;varying vec2 vUv;varying vec3 vN;
#include <fog_pars_vertex>
void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;vN=normalize(mat3(modelMatrix)*normal);
vec4 mvPosition=viewMatrix*w;gl_Position=projectionMatrix*mvPosition;
#include <fog_vertex>
}`;
const FH=`#include <fog_pars_fragment>
varying vec3 vW;varying vec2 vUv;varying vec3 vN;
uniform float time,glow,stars,mist;uniform vec3 sunDir,moonDir,top,hor,sunC,glowC,deep;
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
`;
const TAIL=`
#include <tonemapping_fragment>
#include <encodings_fragment>
#include <fog_fragment>
}`;
function shMat(fs,opts={},extra={}){
 const fogU=opts.fog===false?{}:THREE.UniformsUtils.clone(THREE.UniformsLib.fog);
 return new THREE.ShaderMaterial(Object.assign({uniforms:Object.assign(fogU,U,extra),vertexShader:VS,fragmentShader:FH+fs+TAIL,fog:true},opts));
}

/* ---------- sky ---------- */
const skyMat=shMat(`void main(){vec3 d=normalize(vW);float h=max(d.y,0.);
vec3 c=mix(hor,top,pow(h,.5));
float sd=max(dot(d,sunDir),0.);float up=smoothstep(-.12,.02,sunDir.y);
c+=sunC*(smoothstep(.9992,.9996,sd)*5.+pow(sd,14.)*.4+pow(sd,3.)*.12)*up;
float md=max(dot(d,moonDir),0.);c+=vec3(.82,.9,1.)*(smoothstep(.9993,.9996,md)*1.4+pow(md,80.)*.12)*stars;
vec3 q=floor(d*320.);float r=fract(sin(dot(q,vec3(12.9898,78.233,45.164)))*43758.5453);
c+=vec3(step(.9968,r)*(.55+.45*sin(time*1.7+r*90.))*stars*smoothstep(.02,.3,h));
float cl=vn(d.xz/(d.y+.25)*3.+time*.01)*vn(d.xz/(d.y+.25)*7.-time*.015);c=mix(c,mix(hor,vec3(1.),.5),smoothstep(.25,.6,cl)*.22*(1.-stars)*h);
gl_FragColor=vec4(c,1.);`,{side:THREE.BackSide,fog:false});
const sky=new THREE.Mesh(new THREE.SphereGeometry(140,64,24,0,TAU,0,Math.PI/2),skyMat);
sky.renderOrder=-2;scene.add(sky);

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xffffff,0x334422,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-46,right:46,top:46,bottom:-46,near:10,far:260});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.03;
scene.add(sun,sun.target);sun.target.position.set(0,3,-2);
const spot=new THREE.SpotLight(0xe8fff4,0,40,0.5,0.6,1.2);spot.position.set(0,-50,0);scene.add(spot,spot.target);

/* ---------- day/night keys ---------- */
// h, skyTop, skyHor, light, lightI, hemiSky, hemiGround, hemiI, fog, fogD, bloom, glow, exposure, mist
const NIGHT=[0x030817,0x0c1a33,0x86a6ff,.5,0x203466,0x050a09,.45,0x0b1628,.0032,1.25,1,1.0,.3];
const K=[[0,...NIGHT],
 [5.2,0x07102a,0x1d2848,0x8aa0e8,.45,0x263a6c,0x080d0b,.45,0x141c34,.0034,1.15,.95,1.0,.5],
 [6.1,0x4a6aa0,0xffb190,0xffb088,1.6,0xffcfb4,0x3b4630,.6,0xf0c0a6,.0062,.6,.25,1.0,1],
 [7.6,0x5b8fd0,0xf6dccb,0xffe2c4,2.4,0xdfeaff,0x4f6334,.6,0xe6e2da,.0035,.4,0,1.0,.45],
 [12,0x2a78e0,0xcfe8fa,0xffffff,3.2,0xeef7ff,0x5a7d2c,.7,0xdcecf4,.002,.28,0,1.0,.04],
 [16.5,0x3576cc,0xeedcc2,0xffe6bc,2.6,0xf6ecdc,0x6a6a34,.65,0xeadfcf,.0025,.35,0,1.0,.05],
 [18,0x37508e,0xff9452,0xff9b4a,1.8,0xffb27c,0x8c4a30,.65,0xe39a74,.0045,.75,.35,1.0,.35],
 [19,0x121a3a,0x5c3a5a,0x9c8cd6,.5,0x3c3c70,0x2c1a18,.45,0x2a2238,.0045,1.05,.85,1.0,.3],
 [20.5,...NIGHT],[24,...NIGHT]];
const PH={};const ca=new COL(),cb=new COL();
function phase(h){
 let i=0;while(i<K.length-2&&h>=K[i+1][0])i++;
 const a=K[i],b=K[i+1];let t=(h-a[0])/(b[0]-a[0]);t=t*t*(3-2*t);
 const c=(j)=>ca.setHex(a[j]).lerp(cb.setHex(b[j]),t).getHex(), n=(j)=>a[j]+(b[j]-a[j])*t;
 Object.assign(PH,{top:c(1),hor:c(2),light:c(3),lightI:n(4)*.55,hs:c(5),hg:c(6),hi:n(7)*.75,fog:c(8),fogD:n(9),bloom:n(10),glow:n(11),exp:n(12)*(.78+.22*n(11)),mist:n(13)});
 const a2=(h-6)/12*Math.PI;
 U.sunDir.value.set(-Math.cos(a2),Math.sin(a2),.45).normalize();
 U.moonDir.value.set(Math.cos(a2)*.7,Math.max(.15,-Math.sin(a2)),.55).normalize();
 return PH;
}
const phaseName=h=>h<5.4?'Night':h<7.4?'Dawn':h<11?'Morning':h<15?'Midday':h<17.3?'Afternoon':h<19.2?'Dusk':'Night';

/* ---------- textures + materials ---------- */
function concreteTex(){
 const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
 g.fillStyle='#ebe7de';g.fillRect(0,0,256,256);
 const id=g.getImageData(0,0,256,256),d=id.data;

function nowHours(){const d=new Date();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;}
function frame(){
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(S.live){S.tod=nowHours();todIn.value=S.tod;}
 const ph=phase(S.tod);
 U.time.value=RM?t*.25:t;U.top.value.setHex(ph.top);U.hor.value.setHex(ph.hor);U.sunC.value.setHex(ph.light);
 U.glow.value=ph.glow;U.stars.value=MU.clamp(ph.glow*1.1-.05,0,1);U.mist.value=ph.mist;
 const sd=U.sunDir.value,md=U.moonDir.value,w=MU.smoothstep(sd.y,-.12,.04);
 wp.copy(md).lerp(sd,w);wp.y=Math.max(wp.y,.12);wp.normalize();
 sun.position.copy(sun.target.position).addScaledVector(wp,120);sun.color.setHex(ph.light);sun.intensity=ph.lightI;
 hemi.color.setHex(ph.hs);hemi.groundColor.setHex(ph.hg);hemi.intensity=ph.hi;
 scene.fog.color.setHex(ph.fog);scene.fog.density=ph.fogD*cs.fogK;
 renderer.toneMappingExposure=ph.exp;
 if(bloom)bloom.strength=ph.bloom*(S.q==='high'?1:0);
 M.bulb.color.setScalar(.25+ph.glow*2.4);M.leaf.emissive.setHex(0x0a3a2a).multiplyScalar(ph.glow*.5);
 document.documentElement.style.setProperty('--glow',ph.glow.toFixed(2));
 const mm=Math.floor(S.tod*60);if(mm!==lastMin){lastMin=mm;$('#clk').textContent=`${String(Math.floor(S.tod)%24).padStart(2,'0')}:${String(mm%60).padStart(2,'0')}`;$('#phase').textContent=phaseName(S.tod);}
 envT+=dt;if(envT>1.2){envT=0;updateEnv();}
 // car lights while parked: soft at night
 CARS.forEach(c=>{if(c.state==='parked')carLights(c,ph.glow*.5,.15+ph.glow*.35);});
 spot.intensity=S.running===null&&CARS[S.sel].state==='driving'?ph.glow*4+.3:0;
 // particles
 const dc=CARS.find(c=>c.state==='driving');
 if(dc&&!RM){dc.g.userData.exhaust.getWorldPosition(wp);for(let k=0;k<2;k++)spawn(EXH,wp.x,wp.y,wp.z,rnd(-.3,.3),rnd(.3,.8),rnd(-.3,.3),rnd(1.2,2),rnd(.25,.45));}
 EXH.base=.55;stepP(EXH,dt,.7);
 mistT+=dt;if(mistT>.05&&!RM){mistT=0;const f=pick(FALLS),o=rnd(-.5,.5)*f.w;spawn(MIST,f.x+Math.cos(f.yaw)*o,f.y+.3,f.z-Math.sin(f.yaw)*o,rnd(-.5,.5),rnd(.4,1.1),rnd(-.5,.5),rnd(2,3.5),f.w>3?rnd(2.5,4):rnd(.6,1));}
 MIST.base=.35+ph.mist*.2;stepP(MIST,dt,.6);
 for(let i=0;i<FLY.n;i++){const b=flyBase[i*2],s=flyBase[i*2+1],tt=U.time.value*.3+s;FLY.pos.set([b.x+Math.sin(tt*1.3)*1.5,b.y+Math.sin(tt*.9+s)*.6,b.z+Math.cos(tt*1.1)*1.5],i*3);FLY.al[i]=ph.glow*(.35+.65*Math.max(0,Math.sin(tt*2.1+s*3)));}
 FLY.g.attributes.position.needsUpdate=FLY.g.attributes.alpha.needsUpdate=FLY.g.attributes.size.needsUpdate=true;
 // selection ring
 const sc=CARS[S.sel];selRing.visible=sc.state==='parked'&&S.zoom<=2&&CARS.some(c=>c.open);
 if(selRing.visible){selRing.position.copy(sc.g.position);selRing.position.y+=.03;selRing.rotation.z=sc.b.th;}
 updateCamera(dt);updateLabels();
 if(composer&&S.q==='high')composer.render();else renderer.render(scene,camera);
 requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
S.tod=nowHours();todIn.value=S.tod;phase(S.tod);
buildAll();
if(SMALL)setQuality('low');else resize();
setZoom(2,true);
updateEnv(true);
requestAnimationFrame(frame);
// late-loading car script (if it arrives after this script) gets picked up once
if(!window.SolarpunkCars)addEventListener('load',()=>{if(window.SolarpunkCars)buildAll();});
})();
</script>
</body>
</html>
