<meta charset="utf-8">
<title>Time Grid Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Antonio:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,600&family=IBM+Plex+Mono:wght@400;500;600&family=Michroma&family=Share+Tech+Mono&family=Silkscreen&family=VT323&display=swap">
<style>
/* Layout: sticky bench on top, one full-width board per idea grouped by dial level, parts bin and research below. */
:root{
  --bg:#e8ecef; --paper:#f5f7f9; --ink:#17202a; --dim:#556270; --rule:#bcc6cf; --accent:#2c5b8c; --accent-ink:#ffffff;
  --chip:#dfe5ea; --shadow:rgba(20,32,44,.14);
  --sans:'Archivo',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; --serif:'Cormorant Garamond',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--paper:#161b21;--ink:#e3e8ed;--dim:#9aa7b4;--rule:#2b343e;--accent:#8db6df;--accent-ink:#0f1318;--chip:#212932;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--paper:#161b21;--ink:#e3e8ed;--dim:#9aa7b4;--rule:#2b343e;--accent:#8db6df;--accent-ink:#0f1318;--chip:#212932;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed;background-blend-mode:normal}
body::after{content:"";position:fixed;inset:0;background:var(--bg);opacity:.86;pointer-events:none;z-index:-1}
.wrap{max-width:1160px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
button{font:inherit}
a{color:var(--accent)}
.mast{padding-block:44px 18px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
h1{font:700 clamp(34px,6vw,64px)/1 var(--sans);font-stretch:112%;letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
h2{font:600 22px/1.2 var(--sans);margin:0 0 6px;text-wrap:balance}
h3{font:600 15px/1.3 var(--sans);margin:0 0 4px}
.lede{max-width:68ch;color:var(--dim);margin:0 0 10px}
.lede b{color:var(--ink);font-weight:600}
.bench{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-block:1px solid var(--rule);box-shadow:0 6px 18px var(--shadow)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.bench .wrap{display:flex;flex-wrap:wrap;gap:8px 22px;padding-block:9px;align-items:center}
.bg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bg>span{font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.chip{border:1px solid var(--rule);background:var(--chip);color:var(--ink);padding:5px 10px;font:500 12px var(--mono);cursor:pointer;border-radius:3px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw{display:inline-flex;gap:6px;align-items:center;font:500 12px var(--mono);cursor:pointer}
.sw input{accent-color:var(--accent);width:16px;height:16px}
.idx{display:flex;flex-wrap:wrap;gap:6px;padding-block:14px}
.idx a{font:500 11px var(--mono);text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--paper);padding:4px 8px;border-radius:3px}
.idx a:hover{border-color:var(--accent)}
.dial{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;border:1px solid var(--rule);background:var(--paper);margin-block:10px 40px}
.dial>div{padding:14px 16px;border-right:1px solid var(--rule)}
.dial>div:last-child{border-right:0}
.dial b{display:block;font:600 34px/1 var(--sans);font-stretch:70%;margin-bottom:6px}
.dial p{margin:0;font-size:13px;color:var(--dim)}
.sect{padding-block:30px 8px}
.card{margin:0 0 64px;scroll-margin-top:110px}
.card[hidden]{display:none!important}
.card-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:10px}
.card-h .code{font:600 12px var(--mono);letter-spacing:.1em;color:var(--dim)}
.card-h h2{margin:0}
.pill{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ink);padding:2px 7px;border-radius:99px;white-space:nowrap}
.pill.l{border-color:var(--dim);color:var(--dim)}
.full{margin-left:auto;font:500 11px var(--mono);border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:5px 9px;cursor:pointer;border-radius:3px}
.stage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.stage svg text{pointer-events:none}
.stagewrap{position:relative;width:100%;overflow:hidden;border:1px solid var(--rule);box-shadow:0 10px 30px var(--shadow);background:#000}
.stage{position:absolute;left:0;top:0;width:1040px;transform-origin:0 0}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 24px;margin-top:14px}
.notes h4{margin:0 0 3px;font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.notes p{margin:0;font-size:13.5px;line-height:1.5}
.notes ul{margin:0;padding-left:16px;font-size:13.5px}
.mathnote{display:none;font:italic 400 15px var(--serif);color:var(--accent);margin-top:10px}
body.math .mathnote{display:block}
.rs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.rs article{background:var(--paper);border:1px solid var(--rule);padding:14px 16px}
.rs article p{margin:4px 0;font-size:13.5px}
.rs small{color:var(--dim);font-size:12px}
.shelf{columns:2 300px;column-gap:28px;font-size:13.5px}
.shelf p{break-inside:avoid;margin:0 0 10px}
.shelf b{font-weight:600}
footer{padding-block:40px 80px;color:var(--dim);font-size:13px}
#tip{position:fixed;z-index:60;pointer-events:none;background:#0c1014;color:#e8edf1;font:500 11px var(--mono);padding:5px 8px;border-radius:3px;border:1px solid #35404b;max-width:240px;display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);font:500 12px var(--mono);padding:9px 14px;border-radius:4px;display:none;gap:12px;align-items:center;max-width:92vw}
#toast button{background:none;border:0;color:var(--bg);text-decoration:underline;font:inherit;cursor:pointer}
#focus{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.88);display:none;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 40px}
#focus.open{display:block}
#focus .bar{position:sticky;left:0;display:flex;justify-content:space-between;align-items:center;color:#dde4ea;font:500 12px var(--mono);margin-bottom:10px}
#focus .bar button{background:#dde4ea;color:#10161c;border:0;padding:7px 12px;font:600 12px var(--mono);cursor:pointer;border-radius:3px}
#focus .fs{position:relative;width:1040px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shared board furniture (one block per control family) ---------- */
.b{position:relative;width:1040px;overflow:hidden;color:var(--fg,#111)}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:6px}
.k{appearance:none;border:0;background:none;cursor:pointer;color:inherit;padding:0;line-height:1;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.k svg{width:15px;height:15px;flex:none}
.lab{font:500 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;opacity:.72}
.pod{display:flex;flex-direction:column;gap:2px;min-width:92px}
.pod span{font:500 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.pod b{font:600 22px/1.05 var(--mono);letter-spacing:.02em}
.pod small{display:none;font:italic 400 13px var(--serif);opacity:.9}
body.math .pod small{display:block}
.pn{appearance:none;border:0;background:none;color:inherit;cursor:pointer;display:flex;align-items:center;gap:7px;width:100%;padding:4px 6px;text-align:left;font:500 11px var(--mono)}
.pn i{width:11px;height:11px;flex:none;border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.35) inset}
.pn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn em{font-style:normal;opacity:.7;font-size:10px}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav .dt{font:600 13px var(--mono);letter-spacing:.06em;padding:6px 10px;min-width:150px;text-align:center}
.confirm{font:500 11px var(--mono);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* house (cool silver chrome, CRT-lit active) */
.f-house{--fg:#1d2733;--bg:#dfe6ec}
.f-house .k{padding:7px 10px;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#26323f;background:linear-gradient(#f9fbfc,#c7d0d8);border:1px solid #8794a2;border-radius:3px;box-shadow:inset 0 1px #fff,0 1px 0 #7d8995}
.f-house .k.on{background:#052321;color:#86ffe3;border-color:#021412;box-shadow:inset 0 0 9px #00ffc955,inset 0 1px #0007}
.f-house .pod{background:#06201f;color:#86ffe3;padding:7px 10px;border:2px solid #243038;border-radius:3px;box-shadow:inset 0 0 12px #000a}
.f-house .pn.on{background:#c3ccd5;box-shadow:inset 0 0 0 1px #5f6d7a}
/* line: single-weight drafting-sheet keys (Hardie) */
.f-line{--fg:#14181d;--bg:#f1f2f0}
.f-line .k{padding:6px 9px;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--fg);color:var(--fg);background:var(--bg)}
.f-line .k.on{background:var(--fg);color:var(--bg)}
.f-line .pod{border-top:1px solid var(--fg);padding-top:4px}
.f-line .pn.on{outline:1px solid var(--fg)}
/* dsky: dark mission-control keys with a lit lamp */
.f-dsky{--fg:#d7dde2;--bg:#2b3036}
.f-dsky .k{padding:8px 9px;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#d7dde2;background:linear-gradient(#444b53,#2c3137);border:1px solid #14171a;border-radius:2px;box-shadow:inset 0 1px #5d656e;position:relative}
.f-dsky .k.on{color:#0b1410;background:linear-gradient(#b9ffe5,#6fdcb2);box-shadow:0 0 10px #6fdcb280}
.f-dsky .pod{background:#0a1511;border:1px solid #000;padding:7px 10px;color:#7dffc4}
.f-dsky .pn.on{background:#3a424a}
/* lcars */
.f-lcars{--fg:#ffd8b0;--bg:#000}
.f-lcars .k{padding:8px 16px;font:700 13px var(--lc,'Antonio'),sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#000;background:var(--c,#ff9966);border-radius:99px;justify-content:flex-end;min-width:70px}
.f-lcars .k:nth-child(3n+2){--c:#cc99cc}.f-lcars .k:nth-child(3n){--c:#9999ff}
.f-lcars .k.on{background:#fff}
.f-lcars .pod{border-left:6px solid #ff9966;padding-left:8px}
.f-lcars .pn.on{background:#33262a}
/* y2k gel */
.f-y2k{--fg:#0c3a4e;--bg:#e8f6fb}
.f-y2k .k{padding:7px 14px;font:600 11px var(--sans);letter-spacing:.04em;color:#073047;border-radius:99px;background:linear-gradient(#ffffff,#bfe6f2 55%,#8fd0e6);border:1px solid #6fb7cf;box-shadow:inset 0 1px 1px #fff,0 2px 4px #0a4a6a30}
.f-y2k .k.on{background:linear-gradient(#5fd0ef,#0095b6 70%,#2db3d3);color:#fff;text-shadow:0 1px 1px #04506a;box-shadow:inset 0 1px 2px #ffffffaa,0 0 12px #3ad0f0aa}
.f-y2k .pod{background:#ffffff90;border:1px solid #fff;border-radius:14px;padding:8px 14px;backdrop-filter:blur(4px)}
.f-y2k .pn.on{background:#ffffffa0;border-radius:99px}
/* film: edge print and grease pencil */
.f-film{--fg:#d68a46;--bg:#0e0d0c}
.f-film .k{padding:5px 8px;font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#d68a46;position:relative}
.f-film .k.on{color:#ece6da}
.f-film .k.on::after{content:"";position:absolute;inset:-3px -5px;border:1.5px solid #e04a3a;border-radius:50%;transform:rotate(-2deg);clip-path:polygon(0 0,100% 0,100% 82%,88% 100%,0 100%)}
.f-film .pod b{font-weight:300;font-family:var(--sans);font-stretch:75%;font-size:30px;color:#ece6da}
.f-film .pn.on{color:#ece6da;box-shadow:inset 2px 0 #e04a3a}
.f-film{color:#d68a46}
/* terminal */
.f-term{--fg:#7dff9a;--bg:#030a05}
.f-term .k{font:400 15px 'VT323',monospace;color:#7dff9a;letter-spacing:.04em;padding:0 2px}
.f-term .k::before{content:"[ "}.f-term .k::after{content:" ]"}
.f-term .k.on{background:#7dff9a;color:#030a05}
.f-term .pod b{font:400 28px 'VT323',monospace}
.f-term .pn{font:400 15px 'VT323',monospace}
.f-term .pn.on{background:#7dff9a33}
/* dymo label tape */
.f-dymo{--fg:#ece9e2;--bg:#202226}
.f-dymo .k{padding:5px 9px;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#f4f2ec;background:#15171a;border:1px solid #000;border-radius:2px;text-shadow:0 -1px 0 #000,0 1px 0 #ffffff30;box-shadow:inset 0 0 0 2px #2a2d31}
.f-dymo .k.on{background:#e6372f;border-color:#6d1511;color:#fff}
.f-dymo .pod b{font-family:var(--mono)}
.f-dymo .pn.on{background:#3b3e44}

@media (prefers-reduced-motion:no-preference){
  .dev{animation:dev 1.6s cubic-bezier(.2,.7,.1,1) both}
  @keyframes dev{from{filter:brightness(2.2) contrast(.3) sepia(1) blur(3px)}to{filter:none}}
  .flip{animation:flip .5s ease-out both}
  @keyframes flip{from{transform:rotateX(-90deg)}to{transform:none}}
  .draw{stroke-dasharray:2400;animation:drawon 2.2s ease-out both}
  @keyframes drawon{from{stroke-dashoffset:2400}to{stroke-dashoffset:0}}
  .enh{animation:enh .7s steps(7) both}
  @keyframes enh{from{transform:scale(.55);filter:blur(3px) brightness(1.8)}to{transform:none;filter:none}}
  .bob{animation:bob 6s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(5px)}}
  .spin{animation:spin 34s linear infinite;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
}
@media (max-width:640px){.dial>div{border-right:0;border-bottom:1px solid var(--rule)}.full{margin-left:0}}
</style>
