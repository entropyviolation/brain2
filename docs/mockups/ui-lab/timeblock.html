<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeblock UI Lab</title>
<style>
:root {
  --desk: #008080;
  --phosphor: #7dffc4;
  --ink: #2a2c2e;
  --paper: #c0c0c0;
  --well: #fff;
  --section: #d4d6da;
  --line: #808080;
  --pen: #c4784a;
  --face: Tahoma, "MS Sans Serif", Geneva, sans-serif;
  --type: 13px;
  --title: 13px;
  --label: 11px;
  --help: 11px;
  --title-w: 700;
  --body-w: 500;
  --title-track: 0.12em;
  --label-track: 0.14em;
  --lh: 1.35;
  --gap: 12px;
  --pad: 10px;
  --sec-pad: 10px;
  --inner: 6px;
  --col-gap: 8px;
  --action-gap: 8px;
  --chip-gap: 6px;
  --pop-w: 512px;
  --dlg-h: 780px;
  --r: 3px;
  --ctrl-r: 2px;
  --bw: 2px;
  --sh: 0.45;
  --bevel: 1;
  --close: 22px;
  --title-pad: 6px 10px;
  --mix: 0;
  --glow: 0;
  --scan: 0;
  --clock: 1;
  --row: 32px;
  --btn: 32px;
  --cert: 26px;
  --swatch: 18px;
  --chip: 12px;
  --notes: 52px;
  --split-w: 7.5rem;
  --input-pad: 5px 8px;
  --switch: 22px;
  --case: uppercase;
  --align: flex-start;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Tahoma, "MS Sans Serif", Geneva, sans-serif;
  font-size: 13px;
  background: var(--desk);
  color: #1a1c1e;
}
.lab {
  display: grid;
  grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
  gap: 12px;
  padding: 12px;
  max-width: 1480px;
  margin: 0 auto;
}
.lab-panel {
  background: #c0c0c0;
  color: #2a2c2e;
  border: 2px solid;
  border-color: #fff #808080 #808080 #fff;
  padding: 10px;
  align-self: start;
  position: sticky;
  top: 8px;
  max-height: calc(100vh - 16px);
  overflow: auto;
}
.lab-sections { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-bottom: 8px; font-size: 10px; }
.lab-sections a {
  color: #dfffea;
  text-decoration: none;
  padding: 2px 5px;
  border: 1px solid #666;
  border-radius: 3px;
  background: rgba(0,0,0,.35);
}
.lab-sections a:hover { background: rgba(0,0,0,.5); }
.lab-sections a[aria-current="page"] { background: #000080; color: #fff; border-color: #000080; }
.lab-panel h1 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin: 0 0 6px;
  text-shadow: 0 1px 0 rgba(255,255,255,.78);
}
.lede { margin: 0 0 8px; font-size: 12px; line-height: 1.4; }
fieldset {
  border: 1px solid #808080;
  margin: 0 0 8px;
  padding: 6px 8px 8px;
  background: #d8d8d8;
}
legend { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0 4px; }
.lab-panel label { display: block; font-size: 11px; margin: 6px 0 2px; }
.lab-panel label span { float: right; font-variant-numeric: tabular-nums; }
.lab-panel select, .lab-panel input[type=range] { width: 100%; font: inherit; }
.stage-wrap { min-width: 0; }
.kicker {
  margin: 0 0 8px;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #f4fff8;
  text-shadow: 0 1px 0 rgba(0,0,0,.4);
}
.toast {
  min-height: 1.3em;
  margin: 8px 0 0;
  font-size: 12px;
  color: #f4fff8;
  text-shadow: 0 1px 0 rgba(0,0,0,.45);
}
.stage-grid {
  position: relative;
  min-height: calc(100vh - 48px);
  display: grid;
  place-items: center;
  padding: 28px 16px;
  background: var(--desk);
}
.stage-grid::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: var(--scan);
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.18) 2px, rgba(0,0,0,.18) 3px);
}
.editor {
  position: relative;
  z-index: 1;
  width: min(100%, var(--pop-w));
  max-height: var(--dlg-h);
  overflow: auto;
  padding: var(--pad);
  border-radius: var(--r);
  border: var(--bw) solid;
  border-color:
    color-mix(in srgb, #fff calc(var(--bevel) * 100%), var(--line))
    color-mix(in srgb, #404040 calc(var(--bevel) * 100%), var(--line))
    color-mix(in srgb, #404040 calc(var(--bevel) * 100%), var(--line))
    color-mix(in srgb, #fff calc(var(--bevel) * 100%), var(--line));
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.16) 0 1px, transparent 1px 2px),
    linear-gradient(165deg, color-mix(in srgb, #fff 28%, var(--paper)), var(--paper) 52%, color-mix(in srgb, #000 10%, var(--paper)));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7),
    0 calc(var(--sh) * 12px) calc(var(--sh) * 28px) rgba(0,0,0, calc(var(--sh) * 0.4));
  color: var(--ink);
  font-family: var(--face);
  font-size: var(--type);
  font-weight: var(--body-w);
  line-height: var(--lh);
}
.dlg-head { display: flex; align-items: flex-start; gap: var(--inner); margin-bottom: var(--gap); }
.crt {
  flex: 1;
  margin: 0;
  min-height: 28px;
  padding: var(--title-pad);
  display: flex;
  flex-wrap: wrap;
  justify-content: var(--align);
  align-items: baseline;
  gap: 0.2em 0.45em;
  border-radius: var(--ctrl-r);
  color: color-mix(in srgb, var(--pen) calc(var(--mix) * 50%), var(--phosphor));
  background:
    radial-gradient(ellipse at 18% 0%, color-mix(in srgb, var(--phosphor) 16%, transparent), transparent 46%),
    #070c0a;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pen) calc(var(--mix) * 40%), #000), inset 0 8px 12px rgba(0,0,0,.35);
  font-size: var(--title);
  font-weight: var(--title-w);
  letter-spacing: var(--title-track);
  text-transform: var(--case);
  line-height: var(--lh);
  text-shadow: 0 0 calc(var(--glow) * 10px) var(--phosphor);
}
.crt-time { white-space: nowrap; }
.close {
  width: var(--close);
  height: var(--close);
  flex: 0 0 auto;
  background: #c0c0c0;
  color: #111;
  border-width: 2px;
  border-style: solid;
  border-color: #fff #404040 #404040 #fff;
  cursor: pointer;
  font: inherit;
  font-size: calc(var(--close) * 0.55);
  line-height: 1;
  border-radius: var(--ctrl-r);
}
.help { margin: 0; font-size: var(--help); line-height: var(--lh); font-weight: var(--body-w); color: var(--ink); }
.sec {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--inner);
  margin-top: var(--gap);
  padding: var(--sec-pad);
  border-radius: var(--ctrl-r);
  background:
    linear-gradient(180deg, rgba(0,0,0,.05), transparent 28%),
    var(--section);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    0 0 0 1px color-mix(in srgb, var(--pen) calc(var(--mix) * 65%), var(--line));
}
.sec-title {
  margin: 0;
  font-size: var(--label);
  font-weight: var(--title-w);
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  text-shadow: 0 1px 0 rgba(255,255,255,.4);
}
.clock-grid, .cert-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--col-gap); }
label.field { display: flex; flex-direction: column; gap: calc(var(--inner) * 0.6); font-size: var(--label); font-weight: var(--title-w); letter-spacing: var(--label-track); }
.editor input, .editor textarea {
  font: inherit;
  font-weight: var(--body-w);
  font-size: var(--type);
  letter-spacing: 0;
  text-transform: none;
  color: var(--ink);
  background: var(--well);
  border: var(--bw) solid;
  border-color:
    color-mix(in srgb, #404040 calc(var(--bevel) * 100%), var(--line))
    color-mix(in srgb, #fff calc(var(--bevel) * 100%), var(--line))
    color-mix(in srgb, #fff calc(var(--bevel) * 100%), var(--line))
    color-mix(in srgb, #404040 calc(var(--bevel) * 100%), var(--line));
  border-radius: var(--ctrl-r);
  padding: var(--input-pad);
  min-height: var(--row);
  width: 100%;
  min-width: 0;
}
.clock-grid input {
  min-height: calc(var(--row) * var(--clock));
  font-size: calc(var(--type) * var(--clock));
}
.editor textarea { min-height: var(--notes); resize: vertical; }
.cert { display: flex; min-width: 0; }
.cert button {
  flex: 1;
  min-height: var(--cert);
  font: inherit;
  font-size: var(--label);
  font-weight: var(--title-w);
  padding: 2px 4px;
  cursor: pointer;
  background: var(--well);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 0;
}
.cert button + button { border-left: 0; }
.cert button:first-child { border-radius: var(--ctrl-r) 0 0 var(--ctrl-r); }
.cert button:last-child { border-radius: 0 var(--ctrl-r) var(--ctrl-r) 0; }
.cert button[aria-checked="true"] {
  background: color-mix(in srgb, var(--pen) calc(var(--mix) * 40%), #1f3a37);
  color: #e9fff6;
}
.edge-option, .door, .keycap, .tag, .pen-chip, .next, .edge-chip, .switch button {
  font-family: inherit;
}
.edge-option, .door {
  align-self: flex-start;
  width: auto;
  min-height: var(--btn);
  padding: 3px 8px;
  background: color-mix(in srgb, var(--well) 72%, var(--paper));
  color: var(--ink);
  border: 1px solid var(--ink);
  border-radius: var(--ctrl-r);
  cursor: pointer;
  font-size: var(--type);
  font-weight: var(--body-w);
}
.edge-chip, .next {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  text-align: left;
  width: 100%;
  padding: 6px 8px;
  background: var(--well);
  color: var(--ink);
  border: 1px solid var(--ink);
  border-radius: var(--ctrl-r);
  font-size: var(--type);
  font-weight: var(--title-w);
}
.next span, .edge-chip span { font-size: var(--help); font-weight: var(--body-w); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.switch button {
  flex: 0 0 auto;
  width: calc(var(--switch) * 1.9);
  height: var(--switch);
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #8a8e92;
  position: relative;
  cursor: pointer;
  padding: 0;
}
.switch button[aria-checked="true"] { background: #1f3a37; }
.switch button i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: calc(var(--switch) - 6px);
  height: calc(var(--switch) - 6px);
  border-radius: 50%;
  background: #fff;
}
.switch button[aria-checked="true"] i { left: calc(100% - var(--switch) + 4px); }
.pens, .ticks { display: flex; flex-wrap: wrap; gap: var(--chip-gap); }
.pen-chip, .tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: calc(var(--chip) * 0.25) calc(var(--chip) * 0.7);
  background: var(--well);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: var(--chip);
  font-weight: var(--body-w);
}
.pen-chip i, .tag i {
  width: var(--swatch);
  height: var(--swatch);
  border-radius: 50%;
  display: inline-block;
  flex: 0 0 auto;
}
.tag i { width: calc(var(--swatch) * 0.5); height: calc(var(--swatch) * 0.5); }
.tag { cursor: pointer; }
.tag[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 0; }
.tag em { font-style: normal; font-size: 0.75em; letter-spacing: 0.06em; text-transform: uppercase; }
.pen-chip .star, .pen-chip .x {
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  padding: 0 2px;
}
.add-row { display: flex; gap: var(--chip-gap); align-items: center; }
.add-row input { flex: 1; }
.comp { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: var(--chip-gap); align-items: center; font-size: var(--type); }
.comp-view { font-size: var(--label); font-weight: var(--title-w); letter-spacing: var(--label-track); text-transform: uppercase; }
.obj { display: flex; gap: 8px; align-items: flex-start; font-size: var(--type); font-weight: var(--body-w); text-transform: none; letter-spacing: 0; }
.obj input { width: auto; min-height: 0; margin-top: 3px; }
.obj small { display: block; font-size: var(--help); }
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--action-gap);
  align-items: center;
  margin-top: var(--gap);
}
.split-time { width: var(--split-w); flex: 0 0 auto; }
.keycap {
  min-height: var(--btn);
  padding: 6px 10px;
  font: inherit;
  font-size: var(--type);
  font-weight: var(--title-w);
  color: #1f2226;
  background: linear-gradient(180deg, #f1f3f5, #dfe2e6);
  border: 1px solid #6e7378;
  box-shadow: inset 0 1px 0 #fff;
  border-radius: var(--ctrl-r);
  cursor: pointer;
}
.keycap.save { flex: 1 1 140px; color: #22306c; box-shadow: inset 0 1px 0 #fff, 0 0 0 2px #22306c; }
.keycap.danger { color: #7a1c1c; }
.gone { display: flex; flex-direction: column; gap: var(--inner); align-items: flex-start; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid #7dffc4;
  outline-offset: 2px;
}
@media (max-width: 860px) {
  .lab { grid-template-columns: 1fr; }
  .lab-panel { position: relative; top: 0; max-height: none; }
}
</style>
</head>
<body>
<div class="lab">
  <aside class="lab-panel" id="controls">
    <nav class="lab-sections" aria-label="UI lab sections">
      <a href="index.html">Index</a>
      <a href="shell.html">Shell</a>
      <a href="home.html">Home</a>
      <a href="lists.html">Lists</a>
      <a href="docs.html">Docs</a>
      <a href="scheduler.html">Scheduler</a>
      <a href="operations.html">Ops</a>
      <a href="timeblock.html" aria-current="page">Timeblock</a>
    </nav>
    <h1>Timeblock lab</h1>
    <p class="lede">Tracking entry. The block editor, as it opens from the grid. One dialog.</p>
    <fieldset>
      <legend>Type</legend>
      <label for="font">Font</label>
      <select id="font">
        <option value="house" selected>House (Tahoma / MS Sans Serif)</option>
        <option value="karla">Karla stand-in (Avenir / Segoe)</option>
        <option value="verdana">Verdana</option>
        <option value="trebuchet">Trebuchet</option>
        <option value="georgia">Georgia</option>
        <option value="mono">Courier</option>
        <option value="round">Avenir / Segoe</option>
      </select>
      <label for="titleCase">Title case</label>
      <select id="titleCase">
        <option value="upper" selected>Uppercase</option>
        <option value="none">As written</option>
      </select>
      <label for="titleAlign">Title align</label>
      <select id="titleAlign">
        <option value="start" selected>Start</option>
        <option value="center">Center</option>
      </select>
      <label for="typeSize">Type size <span id="v-typeSize">13</span></label>
      <input id="typeSize" type="range" min="11" max="20" value="13">
      <label for="titleSize">Title size <span id="v-titleSize">13</span></label>
      <input id="titleSize" type="range" min="11" max="22" value="13">
      <label for="labelSize">Label size <span id="v-labelSize">11</span></label>
      <input id="labelSize" type="range" min="9" max="16" value="11">
      <label for="helpSize">Help size <span id="v-helpSize">11</span></label>
      <input id="helpSize" type="range" min="10" max="16" value="11">
      <label for="titleWeight">Title weight <span id="v-titleWeight">700</span></label>
      <input id="titleWeight" type="range" min="400" max="800" step="50" value="700">
      <label for="bodyWeight">Body weight <span id="v-bodyWeight">500</span></label>
      <input id="bodyWeight" type="range" min="400" max="700" step="50" value="500">
      <label for="titleTrack">Title tracking <span id="v-titleTrack">12</span></label>
      <input id="titleTrack" type="range" min="0" max="28" value="12">
      <label for="labelTrack">Label tracking <span id="v-labelTrack">14</span></label>
      <input id="labelTrack" type="range" min="0" max="28" value="14">
      <label for="lineHeight">Line height <span id="v-lineHeight">135</span></label>
      <input id="lineHeight" type="range" min="110" max="180" value="135">
    </fieldset>
    <fieldset>
      <legend>Space</legend>
      <label for="sectionGap">Section gap <span id="v-sectionGap">12</span></label>
      <input id="sectionGap" type="range" min="2" max="28" value="12">
      <label for="dialogPad">Dialog padding <span id="v-dialogPad">10</span></label>
      <input id="dialogPad" type="range" min="4" max="28" value="10">
      <label for="sectionPad">Section padding <span id="v-sectionPad">10</span></label>
      <input id="sectionPad" type="range" min="2" max="24" value="10">
      <label for="innerGap">Inner gap <span id="v-innerGap">6</span></label>
      <input id="innerGap" type="range" min="0" max="18" value="6">
      <label for="colGap">Column gap <span id="v-colGap">8</span></label>
      <input id="colGap" type="range" min="0" max="24" value="8">
      <label for="actionGap">Action gap <span id="v-actionGap">8</span></label>
      <input id="actionGap" type="range" min="0" max="20" value="8">
      <label for="chipGap">Chip gap <span id="v-chipGap">6</span></label>
      <input id="chipGap" type="range" min="0" max="16" value="6">
    </fieldset>
    <fieldset>
      <legend>Frame</legend>
      <label for="popupWidth">Popup width <span id="v-popupWidth">512</span></label>
      <input id="popupWidth" type="range" min="340" max="760" value="512">
      <label for="dialogHeight">Dialog height <span id="v-dialogHeight">780</span></label>
      <input id="dialogHeight" type="range" min="420" max="960" value="780">
      <label for="dialogRadius">Dialog radius <span id="v-dialogRadius">3</span></label>
      <input id="dialogRadius" type="range" min="0" max="20" value="3">
      <label for="controlRadius">Control radius <span id="v-controlRadius">2</span></label>
      <input id="controlRadius" type="range" min="0" max="16" value="2">
      <label for="border">Border <span id="v-border">2</span></label>
      <input id="border" type="range" min="0" max="6" value="2">
      <label for="shadow">Shadow <span id="v-shadow">45</span></label>
      <input id="shadow" type="range" min="0" max="100" value="45">
      <label for="bevel">Bevel <span id="v-bevel">100</span></label>
      <input id="bevel" type="range" min="0" max="100" value="100">
      <label for="closeSize">Close size <span id="v-closeSize">22</span></label>
      <input id="closeSize" type="range" min="16" max="36" value="22">
      <label for="titlePad">Title padding <span id="v-titlePad">6</span></label>
      <input id="titlePad" type="range" min="2" max="16" value="6">
    </fieldset>
    <fieldset>
      <legend>Color</legend>
      <label for="contrast">Contrast <span id="v-contrast">100</span></label>
      <input id="contrast" type="range" min="70" max="140" value="100">
      <label for="colorAmt">Color amount <span id="v-colorAmt">0</span></label>
      <input id="colorAmt" type="range" min="0" max="100" value="0">
      <label for="phosphor">Phosphor <span id="v-phosphor">100</span></label>
      <input id="phosphor" type="range" min="0" max="100" value="100">
      <label for="glow">Title glow <span id="v-glow">0</span></label>
      <input id="glow" type="range" min="0" max="100" value="0">
      <label for="well">Well brightness <span id="v-well">100</span></label>
      <input id="well" type="range" min="35" max="100" value="100">
      <label for="sectionShade">Section shade <span id="v-sectionShade">40</span></label>
      <input id="sectionShade" type="range" min="0" max="100" value="40">
      <label for="backdrop">Backdrop <span id="v-backdrop">12</span></label>
      <input id="backdrop" type="range" min="0" max="100" value="12">
      <label for="scan">Scanlines <span id="v-scan">0</span></label>
      <input id="scan" type="range" min="0" max="100" value="0">
    </fieldset>
    <fieldset>
      <legend>Parts</legend>
      <label for="clockSize">Clock size <span id="v-clockSize">100</span></label>
      <input id="clockSize" type="range" min="70" max="160" value="100">
      <label for="rowHeight">Row height <span id="v-rowHeight">32</span></label>
      <input id="rowHeight" type="range" min="24" max="52" value="32">
      <label for="buttonHeight">Button height <span id="v-buttonHeight">32</span></label>
      <input id="buttonHeight" type="range" min="24" max="48" value="32">
      <label for="certHeight">Certainty height <span id="v-certHeight">26</span></label>
      <input id="certHeight" type="range" min="20" max="44" value="26">
      <label for="switchSize">Switch size <span id="v-switchSize">22</span></label>
      <input id="switchSize" type="range" min="16" max="36" value="22">
      <label for="swatch">Swatch size <span id="v-swatch">18</span></label>

      var mins = parseDuration(value);
      if (mins == null) ui.toast = "Use minutes or hours, such as 45, 1:30 or 1h 30m.";
      else if (mins < 1) ui.toast = "Duration needs at least a minute.";
      else if (b.startMin + mins !== b.endMin) {
        setOver(blockId, { endMin: b.startMin + mins }, true);
        ui.toast = b.startLinked ? "End moved. Start stays on " + b.prevName + "." : "End moved.";
      }
    } else if (field === "start" || field === "end") {
      var clock = parseClock(value);
      var prev = field === "start" ? b.startMin : b.endMin;
      if (clock == null) ui.toast = "Use a time such as 1:15 PM or 13:15.";
      else if (clock === prev) return;
      else if (field === "start" && clock >= b.endMin) ui.toast = "Start is not before End.";
      else if (field === "end" && clock <= b.startMin) ui.toast = "End is before Start. Date can carry a wrap past midnight.";
      else setOver(blockId, field === "start" ? { startMin: clock } : { endMin: clock }, true);
    }
  }
  function commitLive(blockId) {
    stage.querySelectorAll("[data-field]").forEach(function (el) {
      var f = el.dataset.field;
      if (f === "newTag" || f === "newPen" || f === "newObj") return;
      readField(blockId, f, el.value);
    });
  }
  function onStageClick(e) {
    var t = e.target.closest("[data-act]");
    if (!t || !stage.contains(t)) return;
    var blockId = ui.block;
    commitLive(blockId);
    var b = materialize(blockId);
    var act = t.dataset.act;
    if (act === "open" && BLOCKS[t.dataset.id]) ui.block = t.dataset.id;
    else if (act === "cert") setOver(blockId, t.dataset.edge === "start" ? { startC: t.dataset.level } : { endC: t.dataset.level }, true);
    else if (act === "assumed") setOver(blockId, { assumed: !b.assumed }, true);
    else if (act === "date") setOver(blockId, { showDate: !b.showDate }, true);
    else if (act === "unlink") setOver(blockId, t.dataset.edge === "start" ? { startLinked: false } : { endLinked: false }, true);
    else if (act === "linkstart") setOver(blockId, { startLinked: true }, true);
    else if (act === "linkend") setOver(blockId, { endLinked: true }, true);
    else if (act === "star") {
      if (t.dataset.name === b.pen) ui.toast = "Primary paints the grid.";
      else {
        var extra = b.extras.filter(function (x) { return x.name === t.dataset.name; })[0];
        if (extra) {
          var rest = b.extras.filter(function (x) { return x.name !== extra.name; });
          rest.push({ name: b.pen, color: b.penColor });
          setOver(blockId, { pen: extra.name, penColor: extra.color, extras: rest }, true);
        }
      }
    } else if (act === "remove-pen") setOver(blockId, { extras: b.extras.filter(function (x) { return x.name !== t.dataset.name; }) }, true);
    else if (act === "add-pen") {
      var penName = (stage.querySelector("[data-field=newPen]") || {}).value;
      penName = penName ? penName.trim() : "";
      if (!penName) ui.toast = "Type a pen name.";
      else setOver(blockId, { extras: b.extras.concat({ name: penName, color: EXTRA_COLORS[b.extras.length % EXTRA_COLORS.length] }) }, true);
    } else if (act === "detail") {
      setOver(blockId, { details: b.details.map(function (d) { return { name: d.name, on: d.name === t.dataset.name ? !d.on : d.on }; }) }, true);
    } else if (act === "tag") {
      var tag = b.tags.filter(function (x) { return x.name === t.dataset.name; })[0];
      if (tag && tag.always) ui.toast = "Assigned pens always count as " + tag.name + ".";
      else setOver(blockId, { tags: b.tags.map(function (x) { return x.name === t.dataset.name ? Object.assign({}, x, { on: !x.on }) : Object.assign({}, x); }) }, true);
    } else if (act === "add-tag") {
      var tagName = (stage.querySelector("[data-field=newTag]") || {}).value;
      tagName = tagName ? tagName.trim() : "";
      if (!tagName) ui.toast = "Type a tag name.";
      else setOver(blockId, { tags: b.tags.concat({ name: tagName, color: EXTRA_COLORS[b.tags.length % EXTRA_COLORS.length], always: false, on: true }) }, true);
    } else if (act === "always-tag") setOver(blockId, { tags: b.tags.map(function (x) { return x.on ? Object.assign({}, x, { always: true }) : Object.assign({}, x); }) }, true);
    else if (act === "annotate") ui.toast = "Annotate · " + (t.dataset.view || "companion") + " variants, on this block only.";
    else if (act === "someone") ui.toast = "+ Someone adds another person on the Company block.";
    else if (act === "attach") ui.toast = "Attach paints a " + (t.dataset.view || "") + " block for these minutes.";
    else if (act === "obj") {
      var i = +t.dataset.i;
      setOver(blockId, { objectives: b.objectives.map(function (o, idx) {
        if (idx !== i) return Object.assign({}, o);
        var done = !o.done;
        return { text: o.text, done: done, meta: done ? "added → done · just now" : "open" };
      }) }, true);
    } else if (act === "add-obj") {
      var objText = (stage.querySelector("[data-field=newObj]") || {}).value;
      objText = objText ? objText.trim() : "";
      if (!objText) ui.toast = "Type an objective.";
      else setOver(blockId, { objectives: b.objectives.concat({ text: objText, done: false, meta: "open" }) }, true);
    } else if (act === "fields-door") ui.toast = "Edit detail fields opens pen settings for " + b.pen + ".";
    else if (act === "save") ui.toast = "Save block.";
    else if (act === "grid") ui.toast = "show in timegrid — Time Grid, this day, this block, Infinite scroll off.";
    else if (act === "split") {
      var at = parseClock(b.splitAt);
      if (at == null || at <= b.startMin || at >= b.endMin) ui.toast = "Split at needs a minute inside the block.";
      else { setOver(blockId, { splitOn: true }, true); ui.toast = "Split at " + fmt(at) + " into two " + b.pen + " blocks."; }
    } else if (act === "delete") { setOver(blockId, { deleted: true }, true); ui.toast = "Deleted " + b.title + "."; }
    else if (act === "undo") { setOver(blockId, { deleted: false }, false); ui.toast = "Restored " + b.title + "."; }
    else if (act === "close") ui.toast = b.dirty ? "This draft has changes. Save, or exit without saving. Cancel stays." : "Closed.";
    render();
  }
  stage.addEventListener("click", onStageClick);
  stage.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var f = e.target.dataset && e.target.dataset.field;
    if (f === "duration") { e.preventDefault(); readField(ui.block, f, e.target.value); render(); }
    else if (f === "newTag" || f === "newPen" || f === "newObj") {
      e.preventDefault();
      var act = f === "newTag" ? "add-tag" : f === "newPen" ? "add-pen" : "add-obj";
      var btn = stage.querySelector('[data-act="' + act + '"]');
      if (btn) onStageClick({ target: btn });
    }
  });
  stage.addEventListener("focusout", function (e) {
    if (!e.target.dataset || !e.target.dataset.field) return;
    var field = e.target.dataset.field;
    if (field === "newTag" || field === "newPen" || field === "newObj") return;
    var blockId = ui.block, value = e.target.value;
    setTimeout(function () { readField(blockId, field, value); render(); }, 0);
  });
  document.getElementById("controls").addEventListener("input", apply);
  document.getElementById("controls").addEventListener("change", apply);
  render();
})();
</script>
</body>
</html>
