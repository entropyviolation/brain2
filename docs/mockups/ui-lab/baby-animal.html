<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI lab — Baby animal friend</title>
<style>
:root { --navy: #000080; --silver: #c0c0c0; --chrome-edge: #808080; --ink: #1c140f; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; min-height: 100vh; background: #1a1a1a; color: var(--ink);
  font-family: "MS Sans Serif", Tahoma, "Geneva", sans-serif; font-size: 13px;
}
button, select, input, textarea { font: inherit; }
.lab-dock {
  width: min(420px, 100%); flex: none; max-height: 100vh; overflow: auto;
  background: linear-gradient(180deg, #ececec, var(--silver));
  border-right: 2px solid var(--chrome-edge); box-shadow: inset -1px 0 0 #fff;
  padding: 8px 10px 18px; font-size: 11px;
}
.lab-sections { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-bottom: 6px; }
.lab-sections a { color: var(--navy); text-decoration: none; padding: 2px 6px; border: 1px solid var(--chrome-edge); background: #fff; }
.lab-sections a:hover { background: #dfdfdf; }
.lab-sections a[aria-current="page"] { font-weight: 700; background: var(--navy); color: #fff; }
.lab-title { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 10px; color: var(--navy); margin: 2px 0 4px; }
.lab-note { margin: 0 0 8px; line-height: 1.35; }
.reset {
  margin: 0 0 8px; padding: 3px 8px; background: #fff; border: 1px solid var(--chrome-edge); cursor: pointer;
}
fieldset { border: 1px solid var(--chrome-edge); margin: 0 0 8px; padding: 6px 8px 8px; background: #ececec; }
legend { font-weight: 700; color: var(--navy); padding: 0 4px; }
.controls, .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
.controls label, .sliders label { display: flex; flex-direction: column; gap: 2px; }
.controls select, .sliders input[type="range"] { width: 100%; }
.sliders output { font-variant-numeric: tabular-nums; color: var(--navy); }
.stage {
  flex: 1; min-width: 0; min-height: 100vh; overflow: auto;
  display: flex; justify-content: center; padding: 28px 16px 48px;
  background: radial-gradient(circle at 50% 0%, #bdbdbd, #6e6e6e 70%);
}
.mount { width: min(960px, 100%); display: flex; justify-content: center; align-items: flex-start; }
.popup {
  --font: "MS Sans Serif", Tahoma, "Geneva", sans-serif;
  --weight: 400;
  --type: 13px;
  --track: 0em;
  --leading: 1.35;
  --name: 18px;
  --caption: 11px;
  --mission-type: 14px;
  --kicker: 0.06em;
  --space: 8px;
  --pad: 12px;
  --scale: 1;
  --popw: 860px;
  --col: 260px;
  --inset: 8px;
  --tab-pad: 8px;
  --key-pad: 4px 10px;
  --foot: 6px;
  --radius: 18px;
  --key-radius: 6px;
  --border: 1px;
  --shadow: 10px;
  --lift: 72;
  --ink: 100;
  --size: 220px;
  --lace: 7px;
  --lace-dot: 9px;
  --shine: 0.7;
  --nub: 8px;
  --glow: 0.44;
  --chat: 72px;
  --tube-h: 22px;
  --tube-w: 8px;
  --tube-gap: 3px;
  --nixie: 21px;
  --mission-pad: 8px;
  --phos: 100;
  --gem: 18px;
  --friend-hue: 50;
  --warm: 50;
  --sat: 100;
  --contrast: 100;
  position: relative;
  width: min(var(--popw), 100%);
  color: color-mix(in srgb, #1c140f calc(var(--ink) * 1%), #8a8a8a);
  font-family: var(--font);
  font-weight: var(--weight);
  font-size: var(--type);
  letter-spacing: var(--track);
  line-height: var(--leading);
  padding: var(--pad);
  border-radius: var(--radius);
  transform: scale(var(--scale));
  transform-origin: center top;
  background:
    radial-gradient(circle at 18% 0%, rgba(255,255,255, var(--shine)), transparent 28%),
    linear-gradient(180deg, color-mix(in srgb, #fff calc(var(--lift) * 1%), #9a9a9a) 0%, #c8c8c8 42%, color-mix(in srgb, #5e5e5e calc((100 - var(--lift)) * 0.45%), #c8c8c8) 100%);
  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 -1px 0 rgba(0,0,0,.35),
    0 0 0 var(--border) #2a2a2a,
    0 var(--shadow) 0 #6e6e6e;
  filter:
    saturate(calc(var(--sat) / 100))
    sepia(calc(max(0, var(--warm) - 50) * 0.004))
    hue-rotate(calc((50 - var(--warm)) * 0.28deg))
    contrast(calc(var(--contrast) / 100));
}
.x {
  position: absolute; top: 8px; right: 10px; z-index: 4;
  width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%;
  background: linear-gradient(180deg, #f7f7f7, #b0b0b0); color: #1c140f;
  font-weight: 800; cursor: pointer; box-shadow: inset 0 1px 0 #fff, 0 1px 0 #666;
}
.face {
  display: grid;
  grid-template-columns: minmax(160px, var(--col)) minmax(0, 1fr);
  gap: var(--space);
  align-items: start;
}
.portrait { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.window {
  position: relative; height: var(--size); min-height: 96px; padding: 6px;
  border-radius: max(4px, calc(var(--radius) - 4px));
  background:
    radial-gradient(circle at 30% 18%, rgba(255,255,255, var(--shine)) 0 8%, transparent 22%),
    linear-gradient(165deg, #f6f6f6, #c8c8c8 38%, #8c8c8c 72%, #d8d8d8);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.35), 0 0 0 1px #808080;
}
.well {
  position: absolute; inset: var(--inset); z-index: 1; overflow: hidden;
  background: #d5d0c8; border-radius: 8px;
}
.popup[data-shape="arch"] .well { border-radius: 46% 46% 12px 12px; }
.popup[data-shape="heart"] .well { border-radius: 48% 48% 44% 44%; }
.popup[data-shape="oval"] .well { border-radius: 50%; }
.popup[data-shape="round"] .well { border-radius: 50%; box-shadow: inset 0 0 0 6px rgba(255,255,255,.45); }
.popup[data-shape="tribal"] .well { border-radius: 42% 42% 18px 18px; }
.well svg { width: 100%; height: 100%; display: block; filter: hue-rotate(calc((var(--friend-hue) - 50) * 1.4deg)); }
.popup[data-effect="sparkle"] .well::after,
.popup[data-effect="heart"] .well::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 28%, rgba(255,255,255,.55) 46%, rgba(186,230,255,.35) 54%, transparent 72%);
}
.glow {
  position: absolute; inset: var(--inset); z-index: 0; pointer-events: none; opacity: var(--glow);
  background: radial-gradient(circle at 50% 42%, rgba(125,255,196,.55), transparent 68%);
  border-radius: inherit;
}
.popup[data-effect="whisper"] .glow { background: radial-gradient(circle at 50% 42%, rgba(176,140,255,.55), transparent 70%); }
.lace {
  position: absolute; inset: var(--inset); z-index: 2; pointer-events: none; border-radius: inherit;
  box-shadow: inset 0 0 0 var(--lace) #f4ead8;
  background: radial-gradient(circle, rgba(90,52,32,.45) 1px, transparent 1.6px) 0 0 / var(--lace-dot) var(--lace-dot);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  padding: var(--lace);
}
.nub {
  position: absolute; z-index: 3; width: var(--nub); height: var(--nub); border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff, #9a9a9a 60%, #4a4a4a);
  box-shadow: 0 1px 0 #333;
}
.popup[data-lace="0"] .lace { display: none; }
.nub.nw { top: 10px; left: 10px; } .nub.ne { top: 10px; right: 10px; }
.nub.sw { bottom: 10px; left: 10px; } .nub.se { bottom: 10px; right: 10px; }
.hud { margin: 0; font-size: var(--caption); color: #1d6b45; letter-spacing: var(--kicker); }
.name { margin: 0; font-size: var(--name); line-height: 1.2; font-weight: calc(var(--weight) + 200); }
.idle { margin: 4px 0 0; color: #5c4d78; font-size: var(--caption); }
.bubble {
  display: flex; align-items: flex-start; gap: 8px; margin: 6px 0 0;
  padding: 10px 10px 11px 12px; background: #fffef2; color: #3c2817;
  border: 3px solid #3c2817; border-radius: 3px; box-shadow: 3px 3px 0 #1a120c;
  font-size: var(--caption); font-weight: 700; line-height: 1.35;
}
.bubble button.line, .bubble .line {
  margin: 0; flex: 1; padding: 0; border: 0; background: transparent; color: inherit;
  font: inherit; font-weight: inherit; text-align: left; cursor: pointer;
}
.bubble.is-heart { background: #fff5f8; border-color: #8a2048; color: #4a1024; box-shadow: 3px 3px 0 #4a1024; }
.bubble.is-sparkle { background: #f4f0ff; border-color: #3a2080; color: #1e1048; box-shadow: 3px 3px 0 #1e1048; }
.bubble.is-stamp { transform: rotate(-1.4deg); background: #fff8e8; }
.bubble.is-whisper { font-style: italic; font-weight: 600; }
.say {
  grid-column: 1; justify-self: center; width: var(--chat); height: var(--chat);
  border: 0; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0 12%, #e4e4e4 28%, #9a9a9a 70%, #5c5c5c);
  box-shadow: inset 0 2px 0 #fff, inset 0 -3px 4px rgba(0,0,0,.35), 0 3px 0 #4a4a4a;
  font-size: var(--caption); font-weight: 800; color: #1c140f; cursor: pointer;
}
.say:active { transform: translateY(2px); }
.bond {
  grid-column: 2; grid-row: 1 / span 2; padding: 8px;
  border-radius: max(4px, calc(var(--radius) - 8px));
  background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(0,0,0,.05));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
}
.kicker { margin: 0 0 4px; font-weight: 800; letter-spacing: var(--kicker); font-size: var(--caption); }
.tubes { display: flex; flex-wrap: wrap; gap: var(--tube-gap); }
.cap {
  width: var(--tube-w); height: var(--tube-h); border-radius: 3px; background: #d5d5d5;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
}
.cap.on { background: linear-gradient(180deg, #eafff6, #7dffc4 40%, #1d8a5a); box-shadow: 0 0 6px rgba(125,255,196,.8); }
.points-row { display: flex; align-items: center; gap: 6px; margin: 6px 0 0; }
.nixie {
  font-family: ui-monospace, Menlo, Consolas, monospace; color: #9fd4ff;
  font-size: var(--nixie); font-weight: 700; text-shadow: 0 0 6px rgba(159,212,255,.7);
}
.streak, .unlock { margin: 4px 0 0; font-size: var(--caption); }
.mission {
  margin-top: var(--space); display: flex; flex-direction: column; gap: 6px;
  padding: var(--mission-pad); border-radius: max(4px, calc(var(--radius) - 8px));
  background: #07140f;
  color: color-mix(in srgb, #d7ffe9 calc(var(--phos) * 1%), #6d7d74);
  box-shadow: inset 0 0 0 1px rgba(125,255,196,.28);
}
.mission-main { display: flex; align-items: center; gap: 8px; }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: #c9a227; box-shadow: 0 0 6px #c9a227; flex: none; }
.lamp.accepted { background: #7dffc4; box-shadow: 0 0 6px #7dffc4; }
.mission-kicker { margin: 0; font-size: var(--caption); letter-spacing: var(--kicker); text-transform: uppercase; }
.mission-title {
  margin: 0; font-size: var(--mission-type); font-weight: 700; color: inherit; background: transparent;
  border: 0; padding: 0; text-align: left; cursor: pointer;
  font-family: ui-monospace, Menlo, Consolas, monospace;
}
.due {
  margin-left: auto; padding: 2px 6px; background: #140404; color: #ff4d4d;
  font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em;
  font-size: var(--caption); text-shadow: 0 0 6px rgba(255,40,40,.8);
}
.actions { display: flex; flex-wrap: wrap; gap: var(--space); align-items: center; }
.key {
  border: 2px solid; border-color: #fff #404040 #404040 #fff; border-radius: var(--key-radius);
  padding: var(--key-pad); background: linear-gradient(180deg, #fff, #c0c0c0 48%, #9a9a9a);
  color: #111; font-weight: 700; font-size: var(--caption); cursor: pointer;
}
.key:disabled { color: #666; cursor: default; }
.key:focus-visible, .say:focus-visible, .x:focus-visible, .task:focus-visible, .tabs button:focus-visible {
  outline: 2px solid var(--navy); outline-offset: 1px;
}
.pay { margin: 0; font-size: var(--caption); }
.tabs { display: flex; gap: 2px; margin-top: var(--space); }
.tabs button {
  border: 0; border-radius: 6px 6px 0 0; padding: 4px var(--tab-pad);
  background: linear-gradient(180deg, #efefef, #bdbdbd); box-shadow: inset 0 1px 0 #fff;
  font-weight: 800; font-size: var(--caption); color: #1c140f; cursor: pointer;
}
.tabs button[aria-selected="true"] { background: #f7f7f7; }
.panel { min-height: 88px; margin-top: 6px; }
.j-row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
  padding: 4px 6px; background: transparent; border: 0; width: 100%; text-align: left;
  color: inherit; cursor: pointer; font: inherit; font-size: var(--caption);
}
.j-row:hover, .j-row:focus-visible { background: var(--navy); color: #fff; }
.j-note { margin: 0 0 4px 22px; font-size: var(--caption); }
.gem { color: #1d8a5a; font-weight: 800; }
.keep-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.keep {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center;
  font-size: var(--caption);
}
.cameo { width: calc(var(--gem) + 10px); height: var(--gem); border-radius: 50%; border: 2px solid currentColor; }
.keep.is-earned .cameo { background: #f4ead8; box-shadow: inset 0 0 0 2px #8a6040; }
.keep.is-trace .cameo { border-style: dashed; opacity: .55; }
.tube-mini { display: inline-block; width: 36px; height: 6px; background: #ddd; vertical-align: middle; margin-left: 4px; }
.tube-mini i { display: block; height: 100%; background: #7dffc4; width: calc(var(--fill) * 100%); }
.voice { display: flex; flex-direction: column; gap: var(--space); }
.bay-title {
  margin: 0 0 4px; padding: 3px 8px; text-align: center; letter-spacing: var(--kicker);
  font-size: var(--caption); color: #1c140f;
  background: repeating-linear-gradient(90deg, #d0d0d0 0 2px, #f4f4f4 2px 4px);
  box-shadow: inset 0 0 0 1px #888;
}
.keys { display: flex; flex-wrap: wrap; gap: 4px; }
.whims { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.saved-bay { padding: 6px; background: rgba(0,0,0,.06); box-shadow: inset 0 1px 3px rgba(0,0,0,.2); }
.popup[data-push="celebrate"] .push-celebrate { box-shadow: 0 0 0 2px #e7b3c8, inset 0 1px 0 #fff; }
.eq { display: flex; gap: 8px; align-items: flex-end; overflow-x: auto; padding-bottom: 4px; }
.fader { width: 52px; flex: none; text-align: center; font-size: 10px; }
.fader.dim { opacity: .55; }
.slot { position: relative; height: 88px; width: 12px; margin: 4px auto; background: #141414; border-radius: 4px; }
.fader .cap {
  position: absolute; left: 50%; width: 22px; height: 8px; transform: translate(-50%, 50%);
  bottom: calc(var(--v) * 1%); border-radius: 2px;
  background: linear-gradient(180deg, #fff, #b5b5b5 55%, #6a6a6a);
}
.mix { margin: 6px 0; font-size: var(--caption); }
.beads { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; padding: 0; list-style: none; }
.beads li { background: #f4ead8; color: #24180f; border-radius: 999px; padding: 2px 8px; font-size: var(--caption); }
.love-form, .why { display: flex; flex-direction: column; gap: 6px; }
.love-form { flex-direction: row; flex-wrap: wrap; align-items: center; }
.love-form input, .why textarea {
  background: #fff; color: #111; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 4px 6px;
}
.love-form input:focus, .why textarea:focus { outline: 2px solid var(--navy); }
.footer {
  display: flex; flex-wrap: wrap; gap: var(--foot); align-items: center; justify-content: flex-end;
  margin-top: var(--space); padding-top: 6px;
}
.lamp-word { margin-right: auto; font-size: var(--caption); font-weight: 700; }
.lamp-word.unsaved { color: #8a5a00; }
.lamp-word.saved { color: #1d6b45; }
.status { width: 100%; margin: 0; font-size: var(--caption); }
.sheet, .cheer {
  width: min(34rem, 100%); background: #c0c0c0; color: #111;
  padding: 22px 24px 18px;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #404040, 4px 4px 0 #000;
  font-size: var(--type); letter-spacing: var(--track);
}
.sheet h2, .cheer h2 { margin: 0; font-size: calc(var(--name) * 0.9); }
.sheet-kicker { margin: 0 0 6px; font-size: var(--caption); font-weight: 700; letter-spacing: var(--kicker); text-transform: uppercase; color: var(--navy); }
.task {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%;
  margin: 8px 0; padding: 12px 14px; border: 0; text-align: left; font: inherit;
  color: var(--navy); background: #fff; box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #fff; cursor: pointer;
}
.task.static { cursor: default; color: #111; }
.task:hover, .task:focus-visible { background: var(--navy); color: #fff; }
.task.static:hover { background: #fff; color: #111; }
.task b { font-size: var(--mission-type); }
.said { margin: 0 0 8px; padding: 12px 14px; background: #fffef2; color: #3c2817; border: 3px solid #3c2817; font-weight: 700; }
.blurb, .ask { margin: 0 0 8px; }
.cover {
  position: absolute; inset: 0; background: rgba(0,0,0,.35);
  display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; z-index: 5;
}
.cover.item { z-index: 6; background: rgba(0,0,0,.45); }
.cover.cheer { z-index: 7; }
@media (max-width: 880px) {
  body { flex-direction: column; }
  .lab-dock { max-height: 46vh; width: auto; border-right: 0; border-bottom: 2px solid var(--chrome-edge); }
  .face { grid-template-columns: 1fr; }
  .bond { grid-column: 1; grid-row: auto; }
}
</style>
</head>

  <p class="lab-title">UI lab — Baby animal friend</p>
  <p class="lab-note">The friend instrument as it is. These controls only tune this screen.</p>
  <button type="button" class="reset" id="reset">Reset tuning</button>
  <fieldset>
    <legend>Friend</legend>
    <div class="controls">
      <label>Species
        <select id="species">
          <option value="kitten" selected>cute small kitten</option>
          <option value="owl">Baby Owl</option>
          <option value="puppy">Baby Puppy</option>
          <option value="crow">Baby Crow</option>
          <option value="hedgehog">sweet little hedgehog</option>
          <option value="lamb">sweet little lamb</option>
          <option value="bunny">Little bunny</option>
          <option value="mouse">Little mouse</option>
          <option value="seal">Baby Seal</option>
          <option value="fox">baby fox kit</option>
        </select>
      </label>
      <label>Expression
        <select id="expression">
          <option value="content" selected>Content</option>
          <option value="curious">Curious</option>
          <option value="sleepy">Sleepy</option>
          <option value="proud">Proud</option>
          <option value="shy">Shy</option>
        </select>
      </label>
      <label>Dialog effect
        <select id="effect">
          <option value="plain">Plain</option>
          <option value="heart">Heart</option>
          <option value="sparkle" selected>Sparkle</option>
          <option value="stamp">Stamp</option>
          <option value="whisper">Whisper</option>
          <option value="bounce">Bounce</option>
        </select>
      </label>
      <label>Tone
        <select id="tone">
          <option value="gentle">Gentle</option>
          <option value="playful" selected>Playful</option>
          <option value="direct">Direct</option>
          <option value="coach">Coach</option>
        </select>
      </label>
    </div>
  </fieldset>
  <fieldset>
    <legend>Type</legend>
    <div class="controls">
      <label>Font
        <select id="font">
          <option value="system" selected>House (Tahoma)</option>
          <option value="grotesk">Grotesk</option>
          <option value="soft">Soft</option>
          <option value="serif">Serif</option>
          <option value="mono">Mono</option>
        </select>
      </label>
    </div>
    <div class="sliders">
      <label>Weight <output id="weight-out"></output><input id="weight" type="range" min="400" max="800" step="50" value="400"></label>
      <label>Type size <output id="type-out"></output><input id="type" type="range" min="11" max="22" value="13"></label>
      <label>Letter spacing <output id="track-out"></output><input id="track" type="range" min="-2" max="16" value="0"></label>

function onAct(act, node) {
  const value = node && node.dataset ? node.dataset.value || "" : "";
  if (act === "preview") { play.preview = play.preview % 3 + 1; play.status = "Preview only. The header Chat button is the one that logs an offer."; render(); return; }
  if (act === "open-sheet") { play.sheet = true; render(); return; }
  if (act === "close-sheet") { closeSheet(); return; }
  if (act === "close") {
    if (play.item) { play.item = false; render(); return; }
    if (play.sheet) { closeSheet(); return; }
    if (play.dirty && !window.confirm("Discard unsaved personality changes?")) return;
    play.dirty = false; play.saved = true; play.status = "Closed. Unsaved personality edits would be discarded."; render(); return;
  }
  if (act === "accept") { accept(""); return; }
  if (act === "decline") { play.phase = "breakdown"; play.sheet = true; render(); return; }
  if (act === "break-yes") {
    const title = sp().title;
    play.note = "Smaller tasks: Set out " + title + " · " + title + " · Close " + title;
    play.phase = "offer"; render(); return;
  }
  if (act === "break-no") { play.phase = "first"; render(); return; }
  if (act === "first-yes") { accept("Start " + sp().title); return; }
  if (act === "first-no") { play.phase = "why"; render(); return; }
  if (act === "did-it") { play.cheer = true; play.sheet = false; render(); return; }
  if (act === "close-cheer") { play.cheer = false; render(); return; }
  if (act === "item") { play.item = true; render(); return; }
  if (act === "close-item") { play.item = false; render(); return; }
  if (act === "tab") { play.tab = value; render(); return; }
  if (act === "set-tone") { setSelect("tone", value); markDirty(); render(); return; }
  if (act === "set-effect") { setSelect("effect", value); markDirty(); render(); return; }
  if (act === "set-cadence") { play.cadence = value; markDirty(); render(); return; }
  if (act === "set-push") { play.push = value; markDirty(); render(); return; }
  if (act === "preview-whim") { play.preview = 3; play.status = LINES.whim[val("tone")](whimTitle(value)); render(); return; }
  if (act === "voice") {
    const patch = VOICE[value];
    if (!patch) return;
    setSelect("tone", patch.tone);
    setSelect("effect", patch.effect);
    play.cadence = patch.cadence;
    play.push = patch.push;
    play.voice = patch;
    markDirty();
    render();
    return;
  }
  if (act === "drop-love") { play.loves = loves().filter((word) => word !== value); markDirty(); render(); return; }
  if (act === "save") { play.dirty = false; play.saved = true; play.status = "Saved. The page stays open."; render(); return; }
  if (act === "revert") {
    play.voice = null; play.loves = null; play.dirty = false; play.saved = true;
    const s = sp();
    setSelect("tone", s.tone);
    play.cadence = s.cadence;
    play.push = s.push;
    render();
  }
}
function resetTuning() {
  Object.keys(DEFAULTS).forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.value = String(DEFAULTS[id]);
  });
  play.voice = null;
  play.loves = null;
  play.cadence = "chatty";
  play.push = "nudge";
  render();
}
function init() {
  document.getElementById("dock").addEventListener("input", (event) => {
    if (!event.target.matches("input, select")) return;
    if (event.target.id === "species") {
      play.voice = null;
      play.loves = null;
      play.phase = "offer";
      play.note = "";
      play.stepTitle = "";
      play.preview = 0;
      play.reason = "";
      play.cadence = sp().cadence;
      play.push = sp().push;
    }
    render();
  });
  document.getElementById("reset").addEventListener("click", resetTuning);
  document.getElementById("mount").addEventListener("click", (event) => {
    const node = event.target.closest("[data-act]");
    if (!node || node.closest("form")) return;
    onAct(node.dataset.act, node);
  });
  document.getElementById("mount").addEventListener("input", (event) => {
    if (event.target.id === "why") {
      play.why = event.target.value;
      const button = document.getElementById("decline-go");
      if (button) button.disabled = !play.why.trim();
    } else if (event.target.id === "love-add") play.loveDraft = event.target.value;
  });
  document.getElementById("mount").addEventListener("submit", (event) => {
    event.preventDefault();
    if (event.target.dataset.act === "why") {
      const reason = play.why.trim();
      if (!reason) return;
      play.reason = reason;
      play.phase = "declined";
      play.sheet = false;
      play.why = "";
      play.status = "Declined. The reason is in the journal.";
      render();
    } else if (event.target.dataset.act === "add-love") {
      const word = (play.loveDraft || "").trim();
      if (!word) return;
      const next = loves();
      if (!next.includes(word)) next.push(word);
      play.loves = next;
      play.loveDraft = "";
      markDirty();
      render();
    }
  });
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    if (play.item) { play.item = false; render(); return; }
    if (play.cheer) { play.cheer = false; render(); return; }
    if (play.sheet) closeSheet();
  });
  window.setInterval(() => {
    const due = document.getElementById("due");
    if (due) due.textContent = countdown();
  }, 1000);
  render();
}
if (typeof document !== "undefined") init();
</script>
