<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scrying Well</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#030605;--crt:#040a08;--ph:#7dffc4;--ice:#9ad7ff;--pur:#7e14ff;--lav:#7d6bb8;--stroke:#5c6064;--dim:#5f8f7c;--navy:#000080}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ph);font-family:"VT323",monospace;overflow-x:hidden}
main{display:grid;grid-template-columns:1fr 380px;height:100vh;min-height:560px}
#well{position:relative;min-height:0}
#well canvas{display:block;width:100%;height:100%;touch-action:manipulation}
#hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-family:Silkscreen;font-size:11px;letter-spacing:.12em;color:var(--dim);pointer-events:none;transition:opacity 1.2s}
aside{padding:28px 24px 28px 0;display:flex;align-items:center}
.rim{width:100%;padding:3px;border-radius:16px;background:linear-gradient(180deg,#f2f4f6,#8a8f94 40%,#5c6064 55%,#d7dbde);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.glass{border-radius:13px;background:radial-gradient(120% 80% at 50% 0%,#0b1813,var(--crt) 60%);padding:20px 20px 18px;box-shadow:inset 0 0 0 1px #000,inset 0 2px 14px rgba(0,0,0,.9)}
.label{font-family:Silkscreen;font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:4px;margin:8px 0 16px}
.row{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:6px;font-size:20px;color:#a9d9c4}
.row:hover{background:rgba(125,255,196,.06)}
.row[aria-pressed=true]{background:rgba(125,255,196,.1);color:var(--ph)}
.row .t{margin-left:auto;color:var(--dim);font-size:18px}
.lamp{width:8px;height:8px;flex:none;background:currentColor;box-shadow:0 0 6px currentColor,0 0 1px #fff inset}
.min{color:var(--ph)}.goal{color:var(--ice)}.exc{color:#b38cff}
.exc .lamp,.lamp.exc{background:var(--pur);box-shadow:0 0 8px var(--pur)}
#detail{transition:opacity .9s ease,transform .9s ease}
#detail.hide{opacity:0;transform:translateY(6px)}
h2{margin:0;font-family:Silkscreen;font-weight:400;font-size:13px;letter-spacing:.1em;color:#d8fff0}
.clock{font-size:64px;line-height:1;margin:10px 0 2px;text-shadow:0 0 10px rgba(125,255,196,.55)}
.sub{color:var(--dim);font-size:18px}
.was{margin:14px 0 4px;font-size:22px}
.note{margin:6px 0 12px;padding:8px 10px;border-left:2px solid var(--lav);color:#c8bdf0;font-size:19px;background:rgba(125,107,184,.07)}
.lines{list-style:none;padding:0;margin:8px 0 16px}
.lines li{display:flex;gap:10px;align-items:baseline;font-size:18px;padding:3px 0;color:#9cbfb1}
.lines li .lamp{transform:translateY(-2px)}
.lines li .tier{font-family:Silkscreen;font-size:9px;width:30px;flex:none}
.lines li .m{margin-left:auto;white-space:nowrap;color:var(--dim)}
.lines li.cur{color:#e6fff5}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.go{all:unset;cursor:pointer;font-family:Silkscreen;font-size:13px;letter-spacing:.12em;padding:12px 20px;border-radius:999px;color:var(--crt);background:var(--ph);box-shadow:0 0 18px rgba(125,255,196,.45)}
.go.alt{background:transparent;color:var(--ph);box-shadow:inset 0 0 0 1px var(--ph)}
.go:hover{filter:brightness(1.1)}
.link{all:unset;cursor:pointer;font-family:Silkscreen;font-size:10px;letter-spacing:.12em;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.go:focus-visible,.row:focus-visible,.link:focus-visible{box-shadow:0 0 0 2px var(--navy),0 0 0 4px var(--ice)}
.stale{font-size:18px;color:#a9d9c4;margin:4px 0 10px}
.run{font-family:Silkscreen;font-size:11px;letter-spacing:.14em;display:flex;align-items:center;gap:8px}
#tag{position:fixed;left:12px;top:12px;font-family:Silkscreen;font-size:9px;letter-spacing:.08em;color:#9aa0a5;background:rgba(0,0,0,.55);border:1px solid var(--stroke);padding:6px 8px;border-radius:4px;max-width:260px;line-height:1.5;z-index:2}
#tag b{color:#e8ecef;font-weight:400}
@media (max-width:820px){
  main{grid-template-columns:1fr;height:auto}
  #well{height:58vh;min-height:340px}
  aside{padding:0 16px 24px}
  .clock{font-size:54px}
}
</style>
</head>
<body>
<div id="tag"><b>MOCKUP 2 · SCRYING WELL</b><br>Bends rules a little: keeps chrome + phosphor, drops Win95 bevels and fascia keys.</div>
<main>
  <div id="well"><div id="hint">TOUCH A CRYSTAL TO LOOK INTO IT</div></div>
  <aside><div class="rim"><div class="glass">
    <div class="label">Parking lot · resting in the well</div>
    <div class="list" id="list"></div>
    <div id="detail" class="hide"></div>
  </div></div></aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TIER = {min:{c:0x7dffc4,n:'MIN'}, goal:{c:0x9ad7ff,n:'GOAL'}, exc:{c:0x7e14ff,n:'EXC'}};
const S = [
  {name:'Foxtide work', left:10755, budget:'3h', budgetS:10800, parked:'Thu 04:33 AM', was:'Finish CDs',
   note:'Start with the CD sleeves, the art is done.', pos:[-1.25,0.35],
   lines:[['min','Finish CDs','1m / 4h 35m',1],['goal','New merch designs (shirts, hoodie, tote, hat)','0m / 5h'],['exc',"Book Elijah's flights",'0m / 30m']]},
  {name:'Inbox zero sprint', left:1120, budget:'45m', budgetS:2700, parked:'Wed 9:12 PM', was:'Reply to landlord', pos:[1.15,0.75],
   lines:[['min','Reply to landlord','6m / 10m',1],['goal','Archive newsletters','0m / 15m']]},
  {name:'Studio reset', left:3900, budget:'1h 30m', budgetS:5400, parked:'2 days ago', stale:true, was:'Restring guitar', pos:[0.35,-1.25],
   lines:[['min','Coil cables','10m / 10m'],['goal','Restring guitar','15m / 30m',1]]}
];
S.forEach(s => s.tier = s.lines.find(l => l[3])[0]);
const fmt = t => { t = Math.max(0, Math.round(t)); const h = t/3600|0, m = (t%3600)/60|0, s = t%60, p = n => String(n).padStart(2,'0');
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`; };

/* ---------- scene ---------- */
const host = document.getElementById('well');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
host.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030605);
scene.fog = new THREE.Fog(0x030605, 9, 16);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 50);

// studio-strip env map so the chrome reads as chrome
const ec = document.createElement('canvas'); ec.width = 512; ec.height = 256;
{ const g = ec.getContext('2d'), gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#2a2f33'); gr.addColorStop(.42,'#d9dee2'); gr.addColorStop(.5,'#ffffff'); gr.addColorStop(.56,'#3a4044'); gr.addColorStop(1,'#050707');
  g.fillStyle = gr; g.fillRect(0,0,512,256);
  g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(60,40,90,14); g.fillRect(300,30,140,10);
  g.fillStyle = 'rgba(125,255,196,.25)'; g.fillRect(0,150,512,6); }
const envTex = new THREE.CanvasTexture(ec); envTex.mapping = THREE.EquirectangularReflectionMapping;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(envTex).texture;

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x000000, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(-3, 8, 4); scene.add(key);

const R = 3;
const chromeMat = new THREE.MeshStandardMaterial({color:0xd8dcdf, metalness:1, roughness:0.18});
const rim = new THREE.Mesh(new THREE.TorusGeometry(R + 0.14, 0.17, 40, 160), chromeMat);
rim.rotation.x = -Math.PI/2; rim.position.y = 0.04; scene.add(rim);
const lip = new THREE.Mesh(new THREE.TorusGeometry(R + 0.02, 0.035, 16, 160), new THREE.MeshStandardMaterial({color:0x5c6064, metalness:1, roughness:0.35}));
lip.rotation.x = -Math.PI/2; lip.position.y = 0.06; scene.add(lip);
const wall = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.3, R - 0.1, 0.9, 160, 1, true), chromeMat);
wall.position.y = -0.42; scene.add(wall);
const floor = new THREE.Mesh(new THREE.CircleGeometry(R + 0.4, 64), new THREE.MeshBasicMaterial({color:0x000000}));
floor.rotation.x = -Math.PI/2; floor.position.y = -2.4; scene.add(floor);

// black-mirror water: ripples + crystal glow pools in a shader
const rip = [0,1,2,3].map(() => new THREE.Vector4(0, 0, -99, 0));
const glowPos = S.map(() => new THREE.Vector3()), glowCol = S.map(s => new THREE.Color(TIER[s.tier].c));
const waterU = {uT:{value:0}, uRip:{value:rip}, uCalm:{value:1}, uGP:{value:glowPos}, uGC:{value:glowCol}, uR:{value:R}};
const water = new THREE.Mesh(new THREE.CircleGeometry(R, 128), new THREE.ShaderMaterial({
  uniforms: waterU, transparent: true, depthWrite: false,
  vertexShader: `varying vec2 vP; void main(){ vec4 w = modelMatrix*vec4(position,1.); vP = w.xz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `
    uniform float uT, uCalm, uR; uniform vec4 uRip[4]; uniform vec3 uGP[3]; uniform vec3 uGC[3]; varying vec2 vP;
    void main(){
      float r = length(vP)/uR;
      vec3 c = mix(vec3(.010,.022,.018), vec3(.0), r*r);
      c += vec3(.55,.65,.68) * .05 * smoothstep(.15,.95,r) * smoothstep(.2,-1.,vP.y/uR);
      float h = 0.;
      for(int i=0;i<4;i++){
        float a = uT - uRip[i].z; if(a < 0. || a > 9.) continue;
        float d = distance(vP, uRip[i].xy), f = d - a*.32;
        h += sin(f*26.) * exp(-abs(f)*5.) * exp(-a*.42) * uRip[i].w;
      }
      h *= uCalm;
      for(int i=0;i<3;i++){
        float d = distance(vP, uGP[i].xz);
        c += uGC[i] * uGP[i].y * (.16*exp(-d*d*4.) + .05*exp(-d*1.6)) * (1. + h*1.5);
      }
      c += vec3(.75,.95,.88) * .12 * max(h,0.);
      c += vec3(.8) * .35 * smoothstep(.985,1.,r);
      gl_FragColor = vec4(c, .88);
    }`
}));
water.rotation.x = -Math.PI/2; water.renderOrder = 2; scene.add(water);

// crystals
const gc = document.createElement('canvas'); gc.width = gc.height = 128;
{ const g = gc.getContext('2d'), gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.25,'rgba(255,255,255,.35)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128); }
const glowTex = new THREE.CanvasTexture(gc);
const geo = new THREE.OctahedronGeometry(0.3, 0); geo.scale(0.75, 1.5, 0.75);
const BASE_Y = 0.46, UP_Y = 0.8;
const C = S.map((s, i) => {
  const col = TIER[s.tier].c;
  const mat = new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:0.55, metalness:0.2, roughness:0.12, flatShading:true, transparent:true, opacity:0.92});
  const g = new THREE.Group(), m = new THREE.Mesh(geo, mat);
  m.rotation.y = i * 0.9;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:col, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.55}));
  sp.scale.set(1.3, 1.3, 1);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 8), new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false}));
  hit.userData.i = i;
  const pl = new THREE.PointLight(col, 0.5, 3.2);
  g.add(m, sp, hit, pl); scene.add(g);
  const rg = new THREE.Group(), rm = new THREE.Mesh(geo, mat.clone());
  rm.material.emissiveIntensity = 0.3; rm.material.opacity = 0.32; rm.rotation.y = m.rotation.y; rm.scale.y = -1;
  const rs = sp.clone(); rs.material = sp.material.clone(); rs.material.opacity = 0.18;
  rg.add(rm, rs); scene.add(rg);
  g.position.set(s.pos[0], BASE_Y, s.pos[1]);
  return {g, m, sp, rg, rm, rs, hit, pl, y:BASE_Y, gone:false, arc:null};
});
const hits = C.map(c => c.hit);

/* ---------- state + UI ---------- */
let sel = -1, running = null, clockT = 0;
const list = document.getElementById('list'), detail = document.getElementById('detail'), hint = document.getElementById('hint');
let now = 0, ripN = 0;
function ripple(x, z, w){ if (RM) return; rip[ripN++ % 4].set(x, z, now, w); }

function renderList(){
  list.innerHTML = S.map((s, i) => C[i].gone ? '' :
    `<button class="row ${s.tier}" aria-pressed="${i === sel}" data-i="${i}"><span class="lamp"></span>${s.name}<span class="t">${fmt(s.left)}</span></button>`).join('')
    || `<div class="sub">The well is empty.</div>`;
  list.querySelectorAll('.row').forEach(b => b.onclick = () => pick(+b.dataset.i));
}
function linesHTML(s){
  return `<ul class="lines">${s.lines.map(l => `<li class="${l[3] ? 'cur' : ''}"><span class="lamp ${l[0]}" style="color:#${TIER[l[0]].c.toString(16)}"></span><span class="tier" style="color:#${TIER[l[0]].c.toString(16)}">${TIER[l[0]].n}</span>${l[1]}<span class="m">${l[2]}</span></li>`).join('')}</ul>`;
}
function showDetail(html){
  detail.classList.add('hide');
  setTimeout(() => { detail.innerHTML = html; detail.classList.remove('hide'); bind(); }, RM ? 0 : 350);
}
function pick(i){
  if (running || C[i].gone) return;
  sel = sel === i ? -1 : i;
  renderList();
  hint.style.opacity = sel < 0 ? 1 : 0;
  if (sel < 0) { detail.classList.add('hide'); return; }
  const s = S[i], c = C[i];
  ripple(c.g.position.x, c.g.position.z, 1);
  const nxt = s.lines[s.lines.findIndex(l => l[3]) + 1];
  showDetail(`<h2>${s.name.toUpperCase()}</h2>
    <div class="clock">${fmt(s.left)}</div>
    <div class="sub">left of ${s.budget} · parked ${s.parked}</div>
    <div class="was">Was on: <span style="color:#${TIER[s.tier].c.toString(16)}">${s.was}</span>${nxt ? `<div class="sub">Then: ${nxt[1]}</div>` : ''}</div>
    ${s.note ? `<div class="note">${s.note}</div>` : ''}
    ${linesHTML(s)}
    ${s.stale ? `<div class="stale">Parked a while back. Pick a clock:</div>
      <div class="btns"><button class="go" data-a="as">RESUME AS WAS</button><button class="go alt" data-a="fresh">FRESH CLOCK, SAME LINES</button></div>`
      : `<div class="btns"><button class="go" data-a="as">RESUME ▸</button></div>`}
    <div style="margin-top:14px"><button class="link" data-a="sessions">All sessions</button></div>`);
}
function bind(){
  detail.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'as' || a === 'fresh') resume(sel, a === 'fresh');
    else if (a === 'reset') reset();
    else if (a === 'sessions') b.textContent = 'All sessions (goes to To do → Sessions)';
  });
  const g = detail.querySelector('.go'); if (g) g.focus({preventScroll:true});
}
function resume(i, fresh){
  const s = S[i], c = C[i];
  running = {i, t: fresh ? s.budgetS : s.left};
  ripple(c.g.position.x, c.g.position.z, 0.7);
  const p = c.g.position;
  c.arc = {t0: now, from: p.clone(), dir: new THREE.Vector3(p.x, 0, p.z).normalize()};
  detail.classList.add('hide');
  setTimeout(showRunning, RM ? 0 : 2300);
}
function showRunning(){
  const s = S[running.i]; C[running.i].gone = true; sel = -1; renderList();
  clockT = performance.now();
  showDetail(`<div class="run"><span class="lamp min"></span>RUNNING · ${s.name.toUpperCase()}</div>
    <div class="clock" id="runclock">${fmt(running.t)}</div>
    <div class="sub">left of ${s.budget}</div>
    <div class="was">On: <span style="color:#${TIER[s.tier].c.toString(16)}">${s.was}</span></div>
    ${s.note ? `<div class="note">${s.note}</div>` : ''}
    ${linesHTML(s)}
    <button class="link" data-a="reset">Reset mockup</button>`);
}
function reset(){
  const c = C[running.i]; c.gone = false; c.arc = null; c.y = BASE_Y;
  c.g.position.set(S[running.i].pos[0], BASE_Y, S[running.i].pos[1]); c.g.visible = c.rg.visible = true;
  running = null; waterU.uCalm.value = 1; sel = -1; renderList();
  detail.classList.add('hide'); hint.style.opacity = 1;
}

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), mp = new THREE.Vector2();
function hitAt(e){
  const r = renderer.domElement.getBoundingClientRect();
  mp.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1);
  ray.setFromCamera(mp, camera);
  const h = ray.intersectObjects(hits.filter((_, i) => !C[i].gone))[0];
  return h ? h.object.userData.i : -1;
}
renderer.domElement.addEventListener('pointermove', e => renderer.domElement.style.cursor = !running && hitAt(e) >= 0 ? 'pointer' : 'default');
renderer.domElement.addEventListener('click', e => { const i = hitAt(e); if (i >= 0) pick(i); });

/* ---------- loop ---------- */
function resize(){
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  const k = Math.max(1, 1.25/camera.aspect);
  camera.position.set(0, 6.4*k, 6.0*k); camera.lookAt(0, -0.35, 0); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host); resize();
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
let last = performance.now();
function frame(t){
  const dt = Math.min(0.05, (t - last)/1000); last = t; now += dt;
  waterU.uT.value = now;
  if (running) waterU.uCalm.value += (0 - waterU.uCalm.value) * (RM ? 1 : 1 - Math.exp(-dt*0.9));
  C.forEach((c, i) => {
    if (c.gone) { c.g.visible = c.rg.visible = false; glowPos[i].y = 0; return; }
    let glow = 1;
    if (c.arc) {
      const k = RM ? 1 : Math.min(1, (now - c.arc.t0)/2.2), e = ease(k);
      c.g.position.set(c.arc.from.x + c.arc.dir.x*1.2*e, c.arc.from.y + 6.5*e*e + 0.6*Math.sin(e*Math.PI), c.arc.from.z + 2.2*e);
      glow = 1 - e;
    } else {
      c.y += ((i === sel ? UP_Y : BASE_Y) - c.y) * (RM ? 1 : 1 - Math.exp(-dt*1.6));
      c.g.position.y = c.y;
    }
    const dim = sel >= 0 && sel !== i ? 0.45 : 1;
    c.m.material.emissiveIntensity = 0.35 + 0.35*dim; c.sp.material.opacity = 0.5*dim;
    c.pl.intensity = 0.5*dim*glow;
    c.rg.position.set(c.g.position.x, -c.g.position.y, c.g.position.z);
    const near = Math.max(0, 1 - (c.g.position.y - BASE_Y)/2.5);
    c.rm.material.opacity = 0.32*near*dim; c.rs.material.opacity = 0.18*near*dim;
    glowPos[i].set(c.g.position.x, dim*glow*near, c.g.position.z);
  });
  if (running) { const el = document.getElementById('runclock'); if (el) el.textContent = fmt(running.t - (performance.now() - clockT)/1000); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
renderList();
requestAnimationFrame(frame);
</script>
</body>
</html>
