<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1730; --ink:#eef3ff; --dim:#a9b6d6; --faint:#7684a8;
  --glass:rgba(22,32,62,.58); --edge:rgba(190,214,255,.18);
  --min:#6fe0ae; --goal:#7fbef5; --exc:#9a82ec; --focus:#9ad7ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;cursor:default}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.title{position:fixed;left:20px;top:18px;pointer-events:none}
.title h1{margin:0;font-size:15px;font-weight:500;letter-spacing:.02em}
.title p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.tag{position:fixed;right:12px;bottom:12px;font-size:11px;color:var(--dim);background:rgba(10,16,34,.55);border:1px solid var(--edge);padding:5px 9px;border-radius:999px;backdrop-filter:blur(6px)}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:rgba(14,22,46,.62);border:1px solid var(--edge);border-radius:10px;padding:5px 9px 6px;text-align:left;backdrop-filter:blur(6px);white-space:nowrap;transition:opacity .3s}
.lbl b{display:block;font-size:11.5px;font-weight:500}
.lbl span{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.lbl i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.lbl{padding:3px 8px;border-radius:999px;transition:opacity .3s}.lbl span,.lbl em{display:none}.lbl:hover,.lbl:focus-visible{z-index:2;border-radius:10px;padding:5px 9px 6px}.lbl:hover span,.lbl:focus-visible span,.lbl:hover em,.lbl:focus-visible em{display:block}.lbl em{font-style:normal;font-size:10.5px;color:var(--dim)}
.lbl.hide{opacity:0;pointer-events:none}
#sheet{position:fixed;top:12px;right:12px;bottom:12px;width:380px;max-width:calc(100% - 24px);background:var(--glass);border:1px solid var(--edge);border-radius:22px;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;transform:translateX(calc(100% + 24px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#sheet.open{transform:none}
.x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--edge);background:transparent;cursor:pointer;color:var(--dim)}
.eyebrow{margin:0;font-size:12px;color:var(--dim);letter-spacing:.04em}
#sheet h2{margin:-8px 0 0;font-size:24px;font-weight:700}
.big{font-size:52px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.sub{margin:-6px 0 0;font-size:13px;color:var(--dim)}
.was{display:grid;gap:3px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--edge)}
.was small{font-size:11px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.was b{font-size:16px;font-weight:500}
.was em{font-style:normal;font-size:13px;color:var(--dim)}
.note{margin:0;font-size:14px;color:var(--ink);padding-left:12px;border-left:2px solid var(--edge)}
.lines{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lines li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;font-size:13px}
.lines .t{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#0d1530}
.lines .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lines .m{color:var(--dim);font-variant-numeric:tabular-nums}
.lines .bar{grid-column:2/4;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.lines .bar>div{height:100%}
.lines li.cur .n{font-weight:700}
.acts{margin-top:auto;display:grid;gap:8px;padding-top:6px}
.acts p{margin:0 0 2px;font-size:13px;color:var(--dim)}
.go{height:58px;border:0;border-radius:16px;cursor:pointer;font-size:18px;font-weight:700;color:#0b1430;background:linear-gradient(180deg,#d8ecff,#9ad7ff);box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 10px 30px rgba(120,190,255,.25)}
.go.alt{height:46px;font-size:15px;font-weight:500;color:var(--ink);background:rgba(255,255,255,.07);box-shadow:0 0 0 1px var(--edge) inset}
#run{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);transition:transform .5s cubic-bezier(.2,.8,.2,1);background:var(--glass);border:1px solid var(--edge);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:14px 22px 14px;text-align:center;min-width:280px;max-width:calc(100% - 24px)}
#run.on{transform:translate(-50%,0)}
#run .eyebrow i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--min);box-shadow:0 0 8px var(--min);margin-right:7px}
#run .big{margin:6px 0 4px}
#run .now{font-size:14px}
#run .next{font-size:12px;color:var(--dim);margin-top:2px}
#run a{display:inline-block;margin-top:8px;font-size:12px;color:var(--focus)}
@media (max-width:720px){
  .title{left:16px;top:14px}
  #sheet{top:auto;left:12px;right:12px;width:auto;max-height:58%;border-radius:22px;transform:translateY(calc(100% + 24px))}
  .big{font-size:42px}
  #run{top:auto;bottom:44px;transform:translate(-50%,160%)}
}
@media (prefers-reduced-motion:reduce){#sheet,#run,.lbl{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Rooftop parking lot at blue hour with nine parked cars, one per session"></canvas>
<div class="title"><h1>Parking lot</h1><p>9 sessions parked · pick a car to come back to it</p></div>
<div id="labels"></div>
<aside id="sheet" aria-live="polite" aria-hidden="true"></aside>
<div id="run" role="status"></div>
<div class="tag">3 · Night Garage — breaks the rules a lot</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TIER = {Min:'#6fe0ae', Goal:'#7fbef5', Exc:'#9a82ec'};
const SESSIONS = [
  {id:'fox', car:'xj', name:'Foxtide work', left:10755, of:'3h', parked:'parked Thu 04:33 AM', bay:3,
   note:'Start with the CD sleeves, the art is done.',

  {id:'inbox', car:'volvo', name:'Inbox zero sprint', left:1120, of:'45m', parked:'parked Wed 9:12 PM', bay:5,
   lines:[{t:'Min',n:'Reply to landlord',m:'6m / 10m',p:.6,cur:1},{t:'Goal',n:'Archive newsletters',m:'0m / 15m',p:0}]},
  {id:'studio', car:'bronco', name:'Studio reset', left:3900, full:5400, of:'1h 30m', parked:'parked 2 days ago', bay:7, stale:1,
   lines:[{t:'Goal',n:'Restring guitar',cur:1}]},
  {id:'tax', car:'sl', name:'Tax folder', left:2700, of:'1h', parked:'parked Mon 10:05 AM', bay:9,
   lines:[{t:'Min',n:'Find 2025 receipts',m:'10m / 20m',p:.5,cur:1},{t:'Goal',n:'Scan receipts into Drive',m:'0m / 30m',p:0},{t:'Exc',n:'Email the accountant',m:'0m / 10m',p:0}]},
  {id:'mix', car:'panda', name:'Demo mixes', left:2280, of:'1h', parked:'parked Tue 11:48 PM', bay:1,
   lines:[{t:'Min',n:'Bounce rough mix of track 2',m:'12m / 20m',p:.6,cur:1},{t:'Goal',n:'Label stems',m:'0m / 25m',p:0}]},
  {id:'calls', car:'r5', name:'Call list', left:900, of:'30m', parked:'parked today 1:20 PM', bay:10,
   lines:[{t:'Min',n:'Call the pharmacy',m:'4m / 5m',p:.8,cur:1},{t:'Goal',n:'Book the dentist',m:'0m / 10m',p:0},{t:'Exc',n:"Return Sam's call",m:'0m / 15m',p:0}]},
  {id:'grant', car:'olds', name:'Grant draft', left:4200, of:'2h', parked:'parked Fri 2:15 PM', bay:12,
   note:'The budget table is half done. Start there.',
   lines:[{t:'Min',n:'Budget table',m:'30m / 1h',p:.5,cur:1},{t:'Goal',n:'Project summary',m:'0m / 45m',p:0},{t:'Exc',n:'Ask Mara for a letter',m:'0m / 15m',p:0}]},
  {id:'kitchen', car:'van', name:'Kitchen reset', left:2400, of:'1h', parked:'parked Sun 7:30 PM', bay:14,
   lines:[{t:'Min',n:'Clear the counters',m:'8m / 15m',p:8/15,cur:1},{t:'Goal',n:'Wipe fridge shelves',m:'0m / 25m',p:0},{t:'Exc',n:'Sort the spice drawer',m:'0m / 20m',p:0}]},
  {id:'bike', car:'samurai', name:'Bike tune-up', left:1500, of:'40m', parked:'parked Sat 4:10 PM', bay:16,
   lines:[{t:'Min',n:'Pump tires, oil the chain',m:'15m / 20m',p:.75,cur:1},{t:'Goal',n:'Adjust the brakes',m:'0m / 20m',p:0}]}
];
const fmt = s => { s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return h ? h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0') : m+':'+String(x).padStart(2,'0'); };
const cur = s => s.lines.find(l=>l.cur);
const next = s => s.lines.find(l=>!l.cur);
const V3 = THREE.Vector3;
let seed = 11; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;

/* ---------- renderer, sky, fog ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
function cvs(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); return c; }
const bgTex = new THREE.CanvasTexture(cvs(2,256,(g)=>{ const r=g.createLinearGradient(0,0,0,256);
  r.addColorStop(0,'#0a1130'); r.addColorStop(.42,'#1f2e5e'); r.addColorStop(.7,'#2a3c72'); r.addColorStop(1,'#16214a'); g.fillStyle=r; g.fillRect(0,0,2,256); }));
bgTex.encoding = THREE.sRGBEncoding; scene.background = bgTex;
scene.fog = new THREE.Fog(0x1e2c5a, 30, 66);
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,140);
const ISO = new V3(11,12,11), PITCH = Math.atan(12/Math.hypot(11,11));
const camT = new V3(), camGoal = new V3();
let zoom=1.15, zoomGoal=1.15;

// environment map: blue-hour dome with a few cool light panels, so paint, chrome and glass reflect
(function(){
  const env = new THREE.Scene(), sg = new THREE.SphereGeometry(50,32,16), pos = sg.attributes.position, col=[];
  const top=new THREE.Color(0x0c1638), hor=new THREE.Color(0x5670b4), gnd=new THREE.Color(0x070b18), c=new THREE.Color();
  for(let i=0;i<pos.count;i++){ const y=pos.getY(i)/50;
    if(y<0) c.copy(hor).lerp(gnd,Math.min(1,-y*6)); else c.copy(hor).lerp(top,Math.pow(Math.min(1,y*2.2),.7)); col.push(c.r,c.g,c.b); }
  sg.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  env.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.BackSide})));
  const pm = new THREE.MeshBasicMaterial({color:new THREE.Color().setRGB(3,3.4,4)});
  [[-14,22,6,10,1.2],[12,20,-10,8,1],[0,26,0,14,.8],[22,6,4,1.2,6],[-20,5,-12,1.2,5]].forEach(([x,y,z,w,d])=>{
    const p=new THREE.Mesh(new THREE.BoxGeometry(w,.4,d),pm); p.position.set(x,y,z); p.lookAt(0,0,0); env.add(p); });
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, .02).texture;
})();

/* ---------- materials + helpers ---------- */
function std(c,o){ return new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.5, metalness:0}, o||{})); }
const M = {
  chrome:std(0xe8eef6,{metalness:1,roughness:.1}), rubber:std(0x121317,{roughness:.9}), trim:std(0x17191f,{roughness:.55}),
  tan:std(0xc9a676,{roughness:.72}), grille:std(0x07080b,{roughness:.7}),
  steel:std(0xb4bdc9,{metalness:.85,roughness:.28}), white:std(0xe6e9e4,{metalness:.15,roughness:.3}), gray:std(0x4d5259,{roughness:.6}),
  vinyl:std(0x2a1119,{roughness:.85}), conc:std(0x5d6886,{roughness:.9}), wall:std(0x46517a,{roughness:.85}),
  pole:std(0x6a769c,{metalness:.6,roughness:.4}), leaf:std(0x24504f,{roughness:.85,flatShading:true}), bark:std(0x3a3442,{roughness:.9}),
  soil:std(0x15161c,{roughness:1}), line:std(0xc8d4ee,{roughness:.55}),
  seam:std(0x040509,{roughness:.8}), gold:std(0xe0b85c,{metalness:.9,roughness:.3})
};
// tinted see-through glass so the interiors show
M.glass = new THREE.MeshPhysicalMaterial({color:0x2a3b5c, metalness:.1, roughness:.04, clearcoat:1, clearcoatRoughness:.03,
  transparent:true, opacity:.42, envMapIntensity:1.6, depthWrite:false});

/* ---------- procedural texture pack (canvas, cached, 64-512px) ---------- */
const TXC={}, MC={}, GEO={}, R_=Math.random;
const geo=(k,f)=>GEO[k]||(GEO[k]=f());
const mat=(k,f)=>MC[k]||(MC[k]=f());
function ctex(key,w,h,draw,o){ if(TXC[key]) return TXC[key]; o=o||{};
  const t=new THREE.CanvasTexture(cvs(w,h,draw));
  if(o.rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(o.rep[0],o.rep[1]); }
  if(!o.data) t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return TXC[key]=t; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function star(g,x,y,r,c){ g.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, q=i%2?r*.45:r; g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q); }
  g.closePath(); g.fillStyle=c; g.fill(); g.lineJoin='round'; g.lineWidth=5; g.strokeStyle='rgba(30,24,60,.55)'; g.stroke(); }
function pix(w,h,f){ return (g)=>{ const d=g.createImageData(w,h); for(let i=0;i<w*h;i++) f(d.data,i*4); g.putImageData(d,0,0); }; }
const T = {
  // metallic flake: tiny random normals + roughness speckle
  flakeN:()=>ctex('fn',256,256,pix(256,256,(d,i)=>{ const a=R_()*6.283, m=R_()<.3?R_()*80:R_()*16;
    d[i]=128+Math.cos(a)*m; d[i+1]=128+Math.sin(a)*m; d[i+2]=255; d[i+3]=255; }),{rep:[4,4],data:1}),
  flakeR:()=>ctex('fr',256,256,pix(256,256,(d,i)=>{ const v=170+R_()*85; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }),{rep:[3,3],data:1}),
  tread:()=>ctex('tr',512,64,(g,w,h)=>{ g.fillStyle='#0f1013'; g.fillRect(0,0,w,h); g.fillStyle='#25272d';
    for(let i=0;i<32;i++){ const x=i*16; g.beginPath(); g.moveTo(x,4); g.lineTo(x+10,4); g.lineTo(x+16,h/2-3); g.lineTo(x+6,h/2-3); g.fill();
      g.beginPath(); g.moveTo(x+6,h/2+3); g.lineTo(x+16,h/2+3); g.lineTo(x+10,h-4); g.lineTo(x,h-4); g.fill(); } }),
  wall:()=>ctex('wl',256,256,(g)=>{ g.fillStyle='#131418'; g.fillRect(0,0,256,256); g.translate(128,128);
    g.strokeStyle='#2b2d34'; g.lineWidth=3; [88,122].forEach(r=>{ g.beginPath(); g.arc(0,0,r,0,7); g.stroke(); });
    g.fillStyle='#7d828f'; g.font='700 15px DM Sans, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    const t='MOONGRIP ★ 185/70 R13 ★ ALL-NIGHT ★ ', n=t.length;
    for(let i=0;i<n;i++){ g.save(); g.rotate(i/n*6.2832); g.translate(0,-105); g.fillText(t[i],0,0); g.restore(); } }),
  // headlight reflector: soft rings, facets and a cute catchlight
  refl:()=>ctex('rf',128,128,(g)=>{ const gr=g.createRadialGradient(64,64,4,64,64,64);
    gr.addColorStop(0,'#ffffff'); gr.addColorStop(.45,'#e2ecff'); gr.addColorStop(.8,'#9aaccc'); gr.addColorStop(1,'#56658a'); g.fillStyle=gr; g.fillRect(0,0,128,128);
    g.strokeStyle='rgba(255,255,255,.4)'; g.lineWidth=2; for(let r=14;r<64;r+=10){ g.beginPath(); g.arc(64,64,r,0,7); g.stroke(); }
    g.strokeStyle='rgba(70,90,130,.25)'; for(let i=0;i<16;i++){ const a=i*Math.PI/8; g.beginPath(); g.moveTo(64,64); g.lineTo(64+Math.cos(a)*64,64+Math.sin(a)*64); g.stroke(); }
    g.fillStyle='#fff'; g.beginPath(); g.ellipse(42,40,11,8,-.5,0,7); g.fill(); }),
  lens:()=>ctex('ln',128,64,(g,w,h)=>{ g.fillStyle='#4a0610'; g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=10) for(let x=(y/10%2)*6-6;x<w;x+=12){ const gr=g.createLinearGradient(x,y,x,y+9);
      gr.addColorStop(0,'#ff7486'); gr.addColorStop(.4,'#d01a34'); gr.addColorStop(1,'#6e0a18'); g.fillStyle=gr; g.fillRect(x+1,y+1,10,8); }
    g.fillStyle='rgba(255,220,220,.35)'; g.fillRect(0,h*.15,w,3); }),
  grille:()=>ctex('gr',64,64,(g)=>{ g.fillStyle='#06070a'; g.fillRect(0,0,64,64); g.strokeStyle='#3a404c'; g.lineWidth=2;
    for(let i=-64;i<128;i+=8){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+64,64); g.stroke(); g.beginPath(); g.moveTo(i,64); g.lineTo(i+64,0); g.stroke(); } },{rep:[6,2]}),
  glow:()=>ctex('gl',64,64,(g)=>{ const gr=g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.3,'rgba(255,255,255,.35)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); }),
  rim:(t)=>ctex('rim'+t,256,256,(g)=>{ g.translate(128,128);
    g.fillStyle={chrome:'#eef2f8',steel:'#bcc4cf',white:'#f0f0ea',gray:'#80868f'}[t]; g.beginPath(); g.arc(0,0,128,0,7); g.fill();
    g.strokeStyle='rgba(0,0,0,.3)'; g.lineWidth=7; g.beginPath(); g.arc(0,0,116,0,7); g.stroke();
    g.strokeStyle='rgba(255,255,255,.6)'; g.lineWidth=3; g.beginPath(); g.arc(0,0,124,3.6,5.4); g.stroke();
    g.fillStyle='#16181e';
    if(t==='chrome') for(let i=0;i<12;i++){ g.save(); g.rotate(i*Math.PI/6); g.beginPath(); g.ellipse(0,-78,9,28,0,0,7); g.fill(); g.restore(); }
    else if(t==='white') for(let i=0;i<5;i++){ g.save(); g.rotate(i*Math.PI*.4); rr(g,-15,-106,30,52,12); g.fill(); g.restore(); }
    else { const n=t==='steel'?5:4; for(let i=0;i<n;i++){ g.save(); g.rotate(i*6.2832/n+.3); g.beginPath(); g.arc(0,-74,17,0,7); g.fill(); g.restore(); } }
    g.fillStyle='rgba(0,0,0,.45)'; for(let i=0;i<5;i++){ const a=i*Math.PI*.4; g.beginPath(); g.arc(Math.cos(a)*36,Math.sin(a)*36,6,0,7); g.fill(); } }),
  plate:(txt)=>ctex('pl'+txt,256,64,(g,w,h)=>{ g.fillStyle='#1b2550'; rr(g,0,0,w,h,10); g.fill(); g.fillStyle='#ece6d2'; rr(g,4,4,w-8,h-8,8); g.fill();
    g.textAlign='center'; g.fillStyle='#4a58a0'; g.font='700 10px DM Sans, sans-serif'; g.fillText('★ NIGHT GARAGE ☾',w/2,16);

/* ---------- resume: headlights on, reverse out, turn, drive down the ramp ---------- */
function headlights(c,on){
  c.hlM.emissiveIntensity=on?2.6:.12; c.tlM.emissiveIntensity=on?1.1:.3; c.beamM.opacity=on?.2:0; c.beams.forEach(b=>b.visible=on);
  if(on){ c.g.add(hlLight); hlLight.position.set(0,.35,c.len/2+1.2); hlLight.intensity=1.6; }
  else if(hlLight.parent===c.g){ hlLight.intensity=0; scene.add(hlLight); }
}
function resume(s,secs){
  mode='driving'; runS=s; runLeft=secs;
  sheet.classList.remove('open'); sheet.setAttribute('aria-hidden','true'); labels[s.id].classList.add('hide');
  const c=cars[s.id]; headlights(c,true);
  if(RM){ c.g.visible=false; startRun(); return; }
  const h=c.home;
  drive={c, t:0, P0:h.clone(), P1:new V3(h.x,0,0), P2:new V3(h.x-1.25,0,0), last:h.clone()};
  camGoal.set(h.x*.5+2,0,h.z*.3); zoomGoal=1.3;
}
const T0=.6, TR=2.6, TP=.4;
function spin(d,sg){ const m=d.c.g.position.distanceTo(d.last); d.last.copy(d.c.g.position); d.c.wheels.forEach(w=>w.rotation.x+=sg*m/d.c.R); }
function stepDrive(dt){
  const d=drive, g=d.c.g; d.t+=dt;
  if(d.t<T0) return; // a beat with the lights on
  const u=(d.t-T0)/TR;
  if(u<1){ // reverse out of the bay, swinging the tail so the nose ends up facing the ramp
    d.c.rvM.emissiveIntensity=2.2;
    const e=u*u*(3-2*u), a=1-e;
    g.position.set(0,0,0).addScaledVector(d.P0,a*a).addScaledVector(d.P1,2*a*e).addScaledVector(d.P2,e*e);
    const D=new V3().addScaledVector(d.P1.clone().sub(d.P0),a).addScaledVector(d.P2.clone().sub(d.P1),e);
    if(D.lengthSq()>1e-8) g.rotation.set(0,Math.atan2(-D.x,-D.z),0);
    spin(d,-1);
    return;
  }
  d.c.rvM.emissiveIntensity=0;
  const tb=d.t-T0-TR-TP; if(tb<0) return;
  const x=d.P2.x+tb*1.1+tb*tb*1.4, onR=x>LW/2, y=onR?-(x-LW/2)*SLOPE:0;
  g.position.set(x,y,0); g.rotation.set(0,Math.PI/2,0); if(onR) g.rotateX(Math.atan(SLOPE));
  spin(d,1);
  camGoal.set(Math.min(x,LW/2)*.55,0,0);
  if(x>LW/2+6.5){ g.visible=false; drive=null; startRun(); }
}
function startRun(){
  mode='running'; overview(); runT=0;
  const c=cur(runS), n=next(runS);
  run.innerHTML=`<p class="eyebrow"><i></i>Running · ${runS.name}</p><div class="big" id="clk">${fmt(runLeft)}</div>
    <div class="now">Now: <b>${c.n}</b></div>${n?`<div class="next">Next: ${n.n}</div>`:''}<a href="#" id="rst">Reset mockup</a>`;
  run.classList.add('on');
  document.getElementById('rst').onclick=e=>{e.preventDefault(); reset();};
}
function reset(){
  run.classList.remove('on'); mode='lot';
  Object.values(cars).forEach(c=>{ c.g.visible=true; c.g.position.copy(c.home); c.g.rotation.set(0,c.rot,0); headlights(c,false); c.rvM.emissiveIntensity=0; });
  drive=null; runS=null; closeSheet();
}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const carGroups=()=>Object.values(cars).filter(c=>c.g.visible).map(c=>c.g);
let downAt=null;
canvas.addEventListener('pointerdown',e=>downAt=[e.clientX,e.clientY]);
canvas.addEventListener('pointermove',e=>{
  if(mode!=='lot') return canvas.style.cursor='default';
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  canvas.style.cursor = ray.intersectObjects(carGroups(),true).length?'pointer':'default';
});
canvas.addEventListener('pointerup',e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6||mode!=='lot') return;
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(carGroups(),true)[0];
  if(hit) select(hit.object.userData.sid); else if(selected) closeSheet();
});
addEventListener('keydown',e=>{ if(e.key==='Escape'&&selected&&mode==='lot') closeSheet(); });

/* ---------- loop ---------- */
resize();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const k=RM?1:1-Math.exp(-dt*3.2);
  camT.lerp(camGoal,k); zoom+=(zoomGoal-zoom)*k;
  camera.position.copy(camT).add(ISO); camera.lookAt(camT); camera.zoom=zoom; camera.updateProjectionMatrix();
  if(drive) stepDrive(dt);
  if(mode==='running'){ runT+=dt; const el=document.getElementById('clk'); if(el) el.textContent=fmt(runLeft-runT); }
  placeLabels();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
camera.position.copy(ISO); camera.lookAt(0,0,0);
requestAnimationFrame(frame);
})();
</script>
</body>
